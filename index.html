<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>社会 授業アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style id="css">
/* Layout: 白黒基調。上端に黒い罫線つきの見出し（騎馬武者のシルエットと年表の目盛り）→連絡事項→章ジャンプと検索→章ごとの講カード。赤は「重要・NEW・いま」だけに使う。 */
:root{
  --bg:#F6F6F6; --surface:#FFFFFF; --ink:#111111; --muted:#5E5E5E; --line:#D9D9D9;
  --accent:#111111; --accent-soft:#EDEDED; --on-accent:#FFFFFF;
  --done:#1E7A4F; --done-soft:#E3F3EA; --new:#1E9BD7; --on-new:#FFFFFF; --new-ink:#157AAE; --hero-acc:#4FC3F7; --hero-acc2:#7DD3FA; --danger:#B23A3A; --mark:#FFE58A;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --r:12px; --art:none; --map-land:#C9C9C9;
  --f-his:"Anton","Impact","Arial Narrow Bold","Haettenschweiler",sans-serif;
  --f-title:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --hero-bg:#111111; --hero-edge:#111111;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#181818; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --accent:#F2F2F2; --accent-soft:#262626; --on-accent:#111111;
  --done:#62CF98; --done-soft:#183126; --new:#5CC4F2; --on-new:#0E0E0E; --new-ink:#5CC4F2; --danger:#F08A8A; --mark:#6B5A12; --art:invert(1); --hero-bg:#000000; --hero-edge:#333333; --map-land:#4A4A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#181818; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --accent:#F2F2F2; --accent-soft:#262626; --on-accent:#111111;
  --done:#62CF98; --done-soft:#183126; --new:#5CC4F2; --on-new:#0E0E0E; --new-ink:#5CC4F2; --danger:#F08A8A; --mark:#6B5A12; --art:invert(1); --hero-bg:#000000; --hero-edge:#333333; --map-land:#4A4A4A; color-scheme:dark}
:root[data-subj="chiri"]{--new:#7CB82F; --on-new:#111111; --new-ink:#4C8A10; --hero-acc:#A5D84B; --hero-acc2:#C2E77A}
@media (prefers-color-scheme:dark){:root[data-subj="chiri"]:not([data-theme="light"]){--new:#A6D84A; --on-new:#0E0E0E; --new-ink:#A6D84A}}
:root[data-subj="chiri"][data-theme="dark"]{--new:#A6D84A; --on-new:#0E0E0E; --new-ink:#A6D84A}
:root[data-subj="sekaishi"]{--new:#E8913A; --on-new:#111111; --new-ink:#B5651D; --hero-acc:#F2B36B; --hero-acc2:#F7CD98}
@media (prefers-color-scheme:dark){:root[data-subj="sekaishi"]:not([data-theme="light"]){--new:#F2A65A; --on-new:#0E0E0E; --new-ink:#F2A65A}}
:root[data-subj="sekaishi"][data-theme="dark"]{--new:#F2A65A; --on-new:#0E0E0E; --new-ink:#F2A65A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:16px 100px}
.chap,.cnav a,.hit,.dash,.exam{--c:var(--ink);--c-soft:var(--accent-soft);--c-line:var(--line);--c-ink:var(--surface)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);border:1px solid var(--hero-edge);color:#FFFFFF;border-radius:6px;padding:20px 22px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.hero-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .kicker{font-size:11px;letter-spacing:.28em;color:#9A9A9A;font-weight:700}
.hero .jp{font-family:var(--f-title);font-weight:800;font-size:clamp(18px,4.4vw,24px);letter-spacing:.18em;display:flex;align-items:center;gap:10px}
.seal{width:24px;height:24px;background:var(--new);color:#FFFFFF;font-family:var(--f-title);font-weight:800;font-size:14px;display:grid;place-items:center;border-radius:3px;transform:rotate(-4deg);letter-spacing:0}
.his{position:relative;z-index:2;margin-top:18px;min-width:0;font-family:var(--f-his);font-weight:400;font-size:min(17.5vw,196px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:flex-end;white-space:nowrap}
.his .w2{color:transparent;-webkit-text-stroke:2px #FFFFFF;paint-order:stroke}
.his .gap{display:inline-block;width:.32em;align-self:stretch;position:relative}
.his .gap::before{content:"";position:absolute;left:50%;top:6%;bottom:4%;width:.07em;transform:translateX(-50%);background:var(--hero-acc)}
@media (prefers-reduced-motion:no-preference){
  .his .gap{animation:split 1.4s cubic-bezier(.7,0,.2,1) .35s both}
  .his .gap::before{animation:caret 1.1s steps(1) 1.7s 3}
}
@keyframes split{from{width:0}to{width:.32em}}
@keyframes caret{50%{opacity:0}}
.motto{position:relative;z-index:2;margin-top:14px;display:grid;gap:6px;max-width:44ch}
.motto .en{font-size:clamp(14px,3.6vw,17px);letter-spacing:.04em;color:#FFFFFF}
.motto .en em{font-style:normal;color:var(--hero-acc2);font-weight:700}
.motto .ja{display:flex;align-items:center;gap:12px;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(11px,2.9vw,13px);letter-spacing:.32em;color:#D6D6D6;line-height:1.6}
.motto .ja::before{content:"";width:28px;height:1px;background:var(--hero-acc);flex:none}
.hero .hello{position:relative;z-index:2;margin-top:10px;justify-self:start;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.6);padding:3px 12px;border-radius:999px}
.hero .hello b{color:var(--hero-acc2)}
.hero-art{position:relative;display:block;margin:6px -22px 0;width:calc(100% + 44px);height:auto;max-height:170px;color:#EDEDED;opacity:.55;pointer-events:none}
.hero-art .hole{fill:var(--hero-bg)}
.notice{margin-bottom:16px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r);white-space:pre-wrap}
/* 連絡事項 */
.news{position:relative;z-index:1;margin:16px 0 4px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px}
.news h2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.news h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--new);box-shadow:0 0 0 4px color-mix(in srgb,var(--new) 20%,transparent)}
.news h2 small{font-size:12px;font-weight:500;color:var(--muted)}
.nitem{display:grid;grid-template-columns:3.6em 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.nitem:first-of-type{border-top:0}
.nitem time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.nitem .nt{font-weight:700;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0}
.nitem .nb{grid-column:2;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.nitem .nb a{color:var(--accent)}
.nitem.imp{background:color-mix(in srgb,var(--new) 8%,var(--surface));border-radius:8px;padding-inline:8px;margin-inline:-8px;border-top-color:transparent}
/* 連絡事項の下の「テスト用教材」枠 */
.exam{position:relative;z-index:1;margin:10px 0 4px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:14px 18px;display:grid;gap:8px}
.exam h2{font-size:16px;font-weight:900}
.exam .eitem{display:grid;gap:6px}
.exam .eitem p{font-size:14px;margin:0}
.tag.imp{background:var(--new);color:var(--on-new)}
.nmore{justify-self:start;margin-top:4px;background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:700}
.nempty{font-size:13px;color:var(--muted)}
.nedit{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}

/* top cards */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.label{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.now .label{color:var(--on-accent);opacity:.8}
.now h2{font-size:20px;line-height:1.4}
.now h2 small{display:block;font-size:13px;font-weight:500;opacity:.85}
.now .mats a,.now .mats .mat{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.now .none{color:var(--on-accent);opacity:.85}
.now .jump{font-size:13px;color:var(--on-accent)}

.subj{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:22px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.subj button{border:0;background:transparent;padding:12px 8px;font-size:16px;font-weight:900;letter-spacing:.12em;color:var(--muted)}
.subj button+button{border-left:2px solid var(--ink)}
.subj button.on{background:var(--ink);color:var(--surface)}
.xlinks{display:flex;gap:8px;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px}
.xlinks b{flex:none;font-size:11px;color:var(--new-ink);letter-spacing:.06em}
.xlinks span{display:flex;flex-wrap:wrap;gap:5px}
.xl{text-decoration:none;border:1px solid var(--new);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;line-height:1.5}
.xl::after{content:" →";color:var(--new)}
.xl:hover{background:color-mix(in srgb,var(--new) 12%,transparent)}
.stag{display:inline-block;font-size:10px;font-weight:900;padding:0 6px;border-radius:4px;margin-right:6px;border:1px solid var(--ink)}
.stag.s-chiri{background:var(--new);border-color:var(--new);color:var(--on-new)}
.stag.s-sekaishi{background:#E8913A;border-color:#E8913A;color:#111111}
.axis.geo .ainfo{align-self:center}
@media (max-width:520px){.xlinks{flex-direction:column;gap:6px}}
.gmap{display:block;width:100%;min-width:620px;height:auto;color:var(--map-land)}
.gpt{cursor:pointer}
.gpt .hit{fill:transparent}
.gpt .gd{fill:var(--new);stroke:var(--surface);stroke-width:.8}
.gpt:hover .gd{r:3.4}
.gpt.on .gd{fill:var(--ink)}
.gnone{display:flex;gap:8px;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px}
.gnone b{flex:none;font-size:11px;color:var(--muted)}
.gnone span{display:flex;flex-wrap:wrap;gap:5px}
.mxc.sm{display:inline-block;width:auto;padding:2px 10px;border-radius:999px;font-size:12px}
@media (max-width:520px){.gnone{flex-direction:column;gap:6px}}
/* 時空マトリクス */
.mx{scroll-margin-top:72px;margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 16px 14px}
.mx h2{margin:0;font-size:16px;font-weight:900;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mx h2 small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.mxscroll{overflow-x:auto;margin:12px -4px 0;padding:0 4px 4px;-webkit-overflow-scrolling:touch}
.mxgrid{min-width:680px;display:grid;grid-template-columns:76px minmax(0,1fr)}
.mxlab{position:sticky;left:-4px;z-index:2;background:var(--surface);word-break:keep-all;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.25;padding:6px 8px 6px 0;border-top:1px solid var(--line);white-space:pre-line;display:flex;align-items:center}
.mxrow{position:relative;border-top:1px solid var(--line);min-height:30px}
.mxspan{position:absolute;top:0;bottom:0;background:var(--new);opacity:.12;pointer-events:none}
.mxb{position:absolute;height:16px;border:0;padding:0 3px;border-radius:3px;background:var(--ink);color:var(--surface);font:700 9.5px/16px system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;cursor:pointer;text-align:left;transition:opacity .15s}
.mxb.fade{opacity:.22}
.mxb.sel{background:var(--new);color:var(--on-new)}
.mxb:focus-visible{outline:2px solid var(--new);outline-offset:1px}
.mxax{position:relative;height:16px;border-top:1px solid var(--ink);font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mxax span{position:absolute;top:3px;transform:translateX(-50%)}
.mxax span:first-child{transform:none}
.mxhint{margin:10px 0 0;font-size:12px;color:var(--muted)}
.mxinfo{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.mxinfo .t{font-size:15px;font-weight:900;margin:0}
.mxinfo .t small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
.mxinfo .m{font-size:12px;color:var(--muted);margin:4px 0 0}
.mxinfo h4{font-size:12px;margin:12px 0 6px;letter-spacing:.06em}
.mxlead{margin:4px 0 0;font-size:11.5px;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.mxsame{display:grid;gap:4px}
.mxc{display:grid;grid-template-columns:3em minmax(0,1fr);column-gap:6px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.mxc:hover{border-color:var(--ink)}
.mxc b{font-size:11px;font-variant-numeric:tabular-nums}
.mxc .tt{font-size:12.5px;font-weight:700;line-height:1.4}
.mxc .rg{grid-column:2;font-size:10.5px;color:var(--muted)}
.mxgo{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;color:var(--ink)}
.amx{margin-top:2px;border:0;background:none;padding:0;font-family:inherit;font-size:11px;font-weight:700;line-height:1.4;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start;grid-column:1/-1}
/* 時間軸・空間軸（講カード） */
.axis{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.amap{width:132px;height:auto;display:block;color:var(--map-land)}
.amap .dot{fill:var(--new);stroke:var(--surface);stroke-width:2}
.amap .ring{fill:none;stroke:var(--new);stroke-width:1.2;opacity:.45}
.ainfo{display:grid;gap:5px;min-width:0}
.aline{display:flex;align-items:baseline;gap:6px;font-size:12px;min-width:0}
.aline b{font-size:10px;letter-spacing:.12em;color:var(--muted);flex:none;width:2.6em}
.ayr{font-weight:900;font-variant-numeric:tabular-nums;font-size:13px}
.aplace{color:var(--ink);overflow-wrap:anywhere}
.aband{position:relative;height:16px;margin:0 2px}
.aband .trk{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.aband .seg{position:absolute;top:3px;height:10px;background:var(--ink);border-radius:2px;min-width:4px}
.aband .tk{position:absolute;top:4px;width:1px;height:8px;background:var(--muted);opacity:.6}
.aticks{position:relative;height:11px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 2px}
.aticks span{position:absolute;transform:translateX(-50%)}
.aticks span:first-child{transform:none}
.aticks span:last-child{transform:translateX(-100%)}
.ascale{display:flex;gap:4px;flex-wrap:wrap}
.ascale span{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ascale span.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
@media (max-width:520px){.mxgrid{grid-template-columns:62px minmax(0,1fr)}.mxlab{font-size:10px}.mx{padding:14px 12px 12px}.mxinfo .m{word-break:keep-all;overflow-wrap:anywhere}}
@media (max-width:360px){.axis{grid-template-columns:104px minmax(0,1fr)}.amap{width:104px}}
.atl{grid-column:1/-1;display:grid;gap:1px}
/* 用語 */
.terms{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;font-size:12px;border-top:1px dashed var(--line);padding-top:10px}
.terms b{font-size:11px;color:var(--muted);margin-right:2px;letter-spacing:.06em}
.terms span{background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:999px}
/* upload (edit mode) */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;justify-items:start;font-size:13px;color:var(--muted);background:var(--surface)}
.drop.over,.drop:focus{border-color:var(--ink);outline:none;background:var(--accent-soft)}
.drop .btn{cursor:pointer}
.upl input{display:none}
/* original-file save */
.mats .mat small{font-size:10px;font-weight:700;opacity:.75;margin-left:2px}
.mats .dl{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.mats .dl:hover{border-color:var(--accent);color:var(--accent)}
.now .mats .dl{background:transparent;color:var(--on-accent);border-color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center}

/* pdf viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.vbar strong{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar span{font-size:12px;color:var(--muted);white-space:nowrap}
.vzoom{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:34px;height:32px;font-size:16px;font-weight:700}
.vclose{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px}
.vpages{flex:1;overflow:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:12px;align-content:start}
.vpages{justify-items:safe center}
.vpages canvas{display:block;width:calc(min(100%,820px) * var(--z,1));max-width:none;height:auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);border-radius:2px}
.vmsg{padding:40px 16px;text-align:center;color:var(--muted)}

/* pin gate */
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:min(100%,360px);display:grid;gap:14px;text-align:center}
.gate h1{font-size:26px;font-weight:900}
.gate p{color:var(--muted);font-size:14px}
.gate input[type=password]{font-size:24px;letter-spacing:.4em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.gate .err{color:var(--danger);font-size:13px;min-height:1.2em}
.gate .btn.pri{padding:10px;font-size:15px}
.gate .chk{justify-content:center}

/* search results */
.results{margin-top:12px;display:grid;gap:8px}
.results .rhead{font-size:13px;color:var(--muted)}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;min-width:0}
.hit .ht{font-weight:700;text-decoration:none;color:var(--ink)}
.hit .ht small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.hit .why{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}

/* nav */
.cnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:24px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.cnav a{flex:none;text-decoration:none;font-size:13px;font-weight:700;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap;display:flex;align-items:center;gap:6px}
.cnav a b{font-family:var(--f-display);font-weight:400;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--c);color:var(--c-ink)}
.cnav a:hover{border-color:var(--c)}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.search{flex:1 1 240px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* chapters */
.chap{margin-top:36px;scroll-margin-top:64px}
.chead{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 14px;margin-bottom:14px;padding:0 0 12px;border-bottom:2px solid var(--ink)}
.cbadge{grid-row:span 2;font-family:var(--f-display);font-size:24px;width:52px;height:52px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--c-ink)}
.chead .cl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.chead h2{font-size:clamp(18px,4.5vw,22px);font-weight:900;line-height:1.3}
.chead .era{font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
.chead .prog{margin-left:auto;font-size:12px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-width:0;scroll-margin-top:70px;transition:box-shadow .15s,transform .15s}
.lesson:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.lesson.is-current{box-shadow:0 0 0 2px var(--c,var(--accent))}
.lhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lno{font-size:11px;font-weight:700;color:var(--c,var(--accent));background:var(--c-soft,var(--accent-soft));padding:1px 8px;border-radius:999px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.tag.cur{background:var(--accent);color:var(--on-accent)}
.tag.new{background:var(--new);color:var(--on-new)}
.ltitle{font-weight:900;font-size:17px;line-height:1.45;width:100%}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats a,.mats span,.mats .mat{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--c,var(--accent));color:var(--c-ink);background:var(--c,var(--accent));text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mats a:hover,.mats .mat:hover{filter:brightness(1.08);transform:translateY(-1px)}
.mats a.seen::after,.mats .mat.seen::after{content:"✓";font-size:11px;opacity:.9}
.mats a.isnew::before,.mats .mat.isnew::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--new)}
.mats span.later{border-style:dashed;border-color:var(--line);color:var(--muted);background:transparent;font-weight:500}
.none{font-size:13px;color:var(--muted)}
.lfoot{display:flex;justify-content:flex-end}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{margin-top:56px;font-size:12px;color:var(--muted);text-align:center;display:grid;gap:4px}

/* edit */
.editbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.savebar .st{font-size:13px;flex:1 1 200px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.del{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.in{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.ebox{display:grid;gap:8px}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erow > .grow{flex:1 1 180px}
.erow > .narrow{flex:0 0 6.5em}
.etypes{display:grid;gap:6px}
.etypes details{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.etypes summary{cursor:pointer;font-size:13px}
.etypes summary small{color:var(--muted);margin-left:6px}
.flist{display:grid;gap:4px;margin:8px 0;font-size:13px}
.flist div{display:flex;gap:6px;align-items:center;min-width:0}
.flist span{flex:1;min-width:0;overflow-wrap:anywhere}
.edithead{margin-bottom:16px;padding:14px;border:2px dashed var(--accent);border-radius:12px;display:grid;gap:8px;background:var(--surface)}
.edithead label.lb{font-size:12px;color:var(--muted)}
.banner{margin-bottom:12px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

     "items": {

       {
        "name": "大正デモクラシーと護憲運動",
        "file": "files/rekishi/c6l1-print.pdf",
        "fn": "大正デモクラシーと護憲運動_プリント.pdf",
        "d": "2026-10-26",
        "t": "大正時代の日本 教 113 ｐ－\n大正デモクラシーと護憲運動\n１．大正デモクラシーとは何だろう\n① 大正時代前期：第 1 次護憲運動の時期（内閣：西園寺、桂、山本）\n② 大正時代中期：第 1 次世界大戦の時期（内閣：大隈、寺内、原）\n③ 大正時代後期：第 2 次護憲運動の時期（内閣：清浦、加藤）\n西園寺公望内閣\n２個師団増設問題 …陸軍が朝鮮に陸軍部隊（師団）を二つ増やして軍備拡張を要求\n↓\n西園寺 「今は日露戦争でお金を使いすぎたので、財政難です。軍備拡張は諦めてください。」\n↓\n陸軍大臣「認めないなら、陸軍大臣を辞めてやる！」⇨ 新しい陸軍大臣がなかなか決まらなかった\nなぜ決まらない？ ⇨軍部大臣現役武官制：陸軍大臣と軍大臣は現役の武官でなければならない\n↓\n陸軍に嫌われた西園寺内閣は、大臣が決まらず潰れてしまった！\n桂太郎内閣\n宮中（天皇を支える立場）の人間で、陸軍にも影響力を持つ桂太郎が推薦された（力のある元老などから）\n↓\n今まで：宮中は政治に直接干渉しないという慣習があった（天皇の力を後ろ盾に権力が集中するから）\n↓\n国民「今までの慣習を無視するなんてあり得ない。軍部が気に入らない内閣を潰せてしまうのはダメだ！」\n↓\n第一次 護憲 運動 立憲国民党の犬養毅や立憲政友会の尾崎幸雄などが憲法に基づいた政治を求める運動\n⇨商工業者や都市の民衆もこの運動に参加し、桂内閣は 50 日で退陣\nポイント：大衆運動（大正デモクラシー）によって内閣が倒れたことは日本憲政史上初\n⇨ 政党 を中心とした政治運動が進んだ\n資料 桂首相を批判する尾崎行雄\n彼らは忠君愛国を、まるで自分の専売のように唱えているが、常に玉座 （天皇の席）の蔭（かげ）に隠れ、\n政敵を狙撃するかのような行動をとっているのである。…彼らは玉座をもって胸壁（きょうへき）となし、\n詔勅（しょうちょく）を弾丸として政敵を倒そうとしている。\n山本権兵衛内閣 …立憲政友会を与党とした内閣\n現役武官制を改正：現役の武官でなくてもいいように変えなければ！\n↓\nシーメンス事件\nドイツのシーメンス社が日本海軍に賄賂を渡して販売していた\n↓\n山本は海軍出身であり、責任をとって辞任\n大隈重信内閣 …立憲同士会を与党とした内閣\n第一次世界大戦が始まり、日英同盟を理由に参戦\n↓\n氏名＿＿＿＿＿＿＿＿＿\n中国に二十一ヶ条の要求を突きつける\n元老が反発：こんな要求突きつけたら、国際社会から日本が非難されてしまうだろ！ →大隈内閣 退陣…\n寺内正毅内閣 …超然内閣（政党の意見を聞き入れない内閣のこと）\n中国での権益拡大を狙う（大隈と同じく）\n↓\n1918 年： シベリア出兵 開始 ⇨ 米 の値段が急騰\nシベリアに出兵した兵隊の食料を政府が用意しなければならない\n米が買い占められ、米は品薄状態に…\n↓\n富山県の漁村の主婦が米屋に押しかける\n↓\n暴動は全国へ！＝ 米騒動◯\n↓\n寺内は米騒動に軍隊を使って鎮圧したが、非難殺到 →寺内内閣 退陣…\n原敬内閣 …立憲政友会の党員で固めた初の本格的な 政党 内閣（陸海空軍の３大臣以外の官僚）\n↓\n国民の期待大 ⇨政党内閣だから、国民の意見を反映させてくれるはず。普通選挙の実現も期待できる！\n◯吉野作造 民本主義：天皇に統治権があることを前提とし、天皇は民衆の意向に基づく政治を行う\n◯美濃部達吉 天皇機関説：天皇を国家の最高機関に置きながら、民衆の意向に基づく政党政治を実現\nしていくべきであるという考え方\n資料\n所謂機関説と申しまするのは、国家それ自身を一つの生命あり、それ自身に目的を有する恒久的の団体、即ち\n法律学上の言葉を以てせば一つの法人と観念いたしまして、天皇は此の法人たる国家の元首たる地位に在し\nまし、国家を代表して国家の一切の権利を総攬し給ひ、天皇が憲法に従つて行はせられまする行為が、即ち国\n家の行為たる効力を生ずると云ふことを云ひ表はすものであります。\nQ1 史料の中で、天皇の行為が「国家の行為」になる条件が書かれた部分に線を引こう\nQ2 美濃部の考えに近いのはどっち？ ア：天皇は憲法より上にいる イ：天皇も憲法に従う\nQ3 「イ」の考えが攻撃されたのはなぜだろう？\n★原敬が総理大臣になったことで、普通選挙運動が大盛り上がり\n↓\nしかし、労働運動・農民運動・社会主義運動がこれ以上盛り上がってしまう\n↓\n普通選挙の実現は叶わなかったが、納税要件を緩和させて、有権者数を増加させた\nデモクラシーの高揚\n大正デモクラシーの盛り上がりを受けて起こった運動を見てみよう\n「労働運動」\n1919 年、 国際労働機関 （ILO）が設立された。これは労働問題を国際的に協議する国際連盟の姉妹機\n大正時代の日本 教 113 ｐ－\n大正デモクラシーと護憲運動\n関のようなもの。賃上げや労働条件の改善を訴え、日本でも労働争議が多発。1920 年には第 1 回メーデーが開\n催され、1921 年には日本労働総同盟が結成。\n「農民運動」\n農村では小作料の減免を受ける小作争議が頻発。1922 年には日本農民組合が結成。政府は農民の声に応える\n形で、1924 年に小作調停法を制定し、小作人の権利を拡大。\n＜労働争議と小作争議の発生件数と\n参加人数を比較してみよう！＞\n「女性運動」\n1911 年、 平塚らいてう が青鞜社を結成したが、これは女性の\n権利を求める運動というより、文学がメインの団体だった。第一次\n世界大戦がきっかけで、女性の社会進出が拡大。1920 年、市川房枝\nらが新婦人協会を創設。新婦人協会の設立もあって、1922 年、治安\n警察法が改正され、女性の政治演説会の参加が認められるように\nなった。1924 年には婦人参政権獲得期成同盟会が結成されたが、女\n性参政権の獲得は戦後まで待つことになった。\n「社会主義運動」\n1922 年、コミンテルンの日本支部の日本共産党が結成。堺利彦、山川均らによって作られた。\n「全国水平社」\n1922 年 3 月 3 日、部落差別を受け、苦しめられてきた人々約 3000 人が京都に集まり、自らの力による差別か\nらの解放と、人間としての平等と自由の獲得をめざす全国水平社を創立した。\n大正時代の経済\n日本は空前の好景気に沸いていた なぜ？？\n◯第一次世界大戦 によって、交戦中のヨーロッパからアジアへの輸出が止まったから\n＞アジアで日本の輸出が拡大 重化学工業・繊維業・造船業が急成長 貿易収支は大幅黒字「大戦景気」\n＞ヨーロッパが市場に戻ってきた 大戦が終わると大戦景気は STOP し、日本は戦後恐慌になってしまった\n関東大震災\n1923 年 9 月 1 日午前 11 時 58 分 関東地方を中心に巨大地震が発生。地震そのものの死者よりも火災による死\n者の方が多く、死者は 10 万人を超えた。\n★1920 年代前半は、 戦後恐慌 ⇨ 震災恐慌 と恐慌が続く時代\n清浦圭吾内閣 …超然内閣(政党も国民も無視) なぜ？？\n関東大震災による社会不安の中、人々に自由を与えると何をするかわからないと考えたから\n氏名＿＿＿＿＿＿＿＿＿\n↓\nみんなの意見を無視して政治をやったことで、結果的に周りを怒らせた\n護憲三派による第二次護憲運動が始まった\n◯護憲三派◯ とは？？\n第二次護憲運動をやっていた 3 つの政党のこと。立憲政友会の 高橋是清 、憲政会の 加藤高明 、\n革新倶楽部の 犬養毅 の 3 政党を指す。\n一方、清浦も政友本党を作ってこの流れに対抗\n総選挙は護憲三派の圧勝 …第二次護憲運動によって政権交代が実現した\n加藤高明内閣\n★◯普通選挙法 を制定\n1925年、 満 25 歳以上の男性全員に無条件で選挙権が与えられた\n★◯治安維持法 を制定\n社会主義運動や労働運動を抑えるため\n「原内閣が普通選挙を実現できなかった理由を思い出そう」\n普通選挙の実施による、労働運動・農民運動・社会主義運動などの\n運動の盛り上がりを危惧 →断念\n↓\n「加藤内閣はなぜ実現できた？」\n普通選挙法とセットで運動を弾圧する法令（治安維持法）も出して、運動が盛り上がりすぎないようにした\n治安維持法を制定した理由はもう一つ！\nこの年、日本はソ連と国交を樹立 →日ソ基本条約\n「日本がソ連を国として認めた！社会主義の国を認めた！」 ⇨共産主義や社会主義が盛り上がってしまう…\n＞治安維持法によって抑止\n普通選挙法が制定されると、小作農や労働者を支持基盤とする政党が結成されるようになった（無産政党）"

        "t": "大正デモクラシーと護憲運動\n歴史総合\nおしながき\n★大正デモクラシーとは何か理解しよう\n護憲運動によって内閣がどう変わったか確認しよう\n普通選挙法と治安維持法が同時に作られた理由を考えよう\n１．\n大正デモクラシーとは何だろう\n①大正時代前期\n第1次護憲運動の時期（内閣：西園寺、桂、山本）\n②大正時代中期\n第1次世界大戦の時期（内閣：大隈、寺内、原）\n③大正時代後期\n第2次護憲運動の時期（内閣：清浦、加藤）\n西園寺公望内閣\n２個師団増設問題　…陸軍が朝鮮に陸軍部隊（師団）を二つ増やして軍備拡張を要求\n西\n西園寺　「今は日露戦争でお金を使いすぎたので、財政難です。\n軍備拡張は諦めてください。」\n陸\n陸軍大臣　「認めないなら、陸軍大臣を辞めてやる！」\n⇨ 新しい陸軍大臣がなかなか決まらなかった\n西園寺公望内閣\nなぜ決まらない？\n⇨ 軍部大臣現役武官制：陸軍大臣と海軍大臣は現役の武官でなければならない\n陸軍に嫌われた西園寺内閣は、大臣が決まらず潰れてしまった！\n桂太郎内閣\n宮中（天皇を支える立場）の人間で、陸軍にも影響力を持つ桂太郎が推薦された\n（力のある元老などから）\n今まで：宮中は政治に直接干渉しないという慣習があった\n（天皇の力を後ろ盾に権力が集中するから）\n国\n国民　「今までの慣習を無視するなんてあり得ない。\n軍部が気に入らない内閣を潰せてしまうのはダメだ！」\n第一次護憲運動\n第一次護憲運動\n立憲国民党の犬養毅や立憲政友会の尾崎行雄などが、憲法に基づいた政治を求める運動\n⇨ 商工業者や都市の民衆もこの運動に参加し、桂内閣は50日あまりで退陣\nポイント：大衆運動（大正デモクラシー）によって内閣が倒れたことは日本憲政史上初\n⇨ 政党を中心とした政治運動が進んだ\nスローガンは「閥族打破・憲政擁護」\n補足\n資料\n桂首相を批判する尾崎行雄\n資料　桂首相を批判する尾崎行雄\n“\n彼らは忠君愛国を、まるで自分の専売のように唱えているが、常に玉座（天皇の席）の蔭（かげ）に隠れ、政敵を狙撃するかのような行動をとっているのである。…彼らは玉座をもって胸壁（きょうへき）となし、詔勅（しょうちょく）を弾丸として政敵を倒そうとしている。\n尾崎行雄\n山本権兵衛内閣\n…立憲政友会を与党とした内閣\n現役武官制を改正\n：現役の武官でなくてもいいように変えなければ！\nシーメンス事件\nドイツのシーメンス社が日本海軍に賄賂を渡して販売していた\n山本は海軍出身であり、責任をとって辞任\n風刺画（シーメンス事件）\n大隈重信内閣\n…立憲同志会を与党とした内閣\n第一次世界大戦が始まり、日英同盟を理由に参戦\n中国に二十一カ条の要求を突きつける\n元\n元老　元老が反発：「こんな要求突きつけたら、\n国際社会から日本が非難されてしまうだろ！」\n→ 大隈内閣　退陣…\n寺内正毅内閣\n…超然内閣（政党の意見を聞き入れない内閣のこと）\n中国での権益拡大を狙う（大隈と同じく）\n1918年：シベリア出兵開始\n⇨ 米の値段が急騰\nシベリアに出兵した兵隊の食料を政府が用意しなければならない\n米が買い占められ、米は品薄状態に…\n寺内正毅内閣\n米騒動\n富山県の漁村の主婦が米屋に押しかける\n暴動は全国へ！＝米騒動\n寺内は米騒動に軍隊を使って鎮圧したが、非難殺到　→寺内内閣　退陣…\n大阪の米価は1918年1月の約23円から、8月には約41円に（1石あたり）\n補足\n原敬内閣\n…立憲政友会の党員で固めた初の本格的な政党内閣\n（陸軍・海軍・外務の３大臣以外は政友会の党員）\n国\n国民　国民の期待大\n⇨ 政党内閣だから、国民の意見を反映させてくれるはず。普通選挙の実現も期待できる！\n原敬は爵位を持たない衆議院議員として初めて首相に →「平民宰相」\n補足\n政党政治を支えた考え方\n民本主義\n◯吉野作造\n民本主義：\n天皇に統治権があることを前提とし、天皇は民衆の意向に基づく政治を行う\n天皇機関説\n◯美濃部達吉\n天皇機関説：\n天皇を国家の最高機関に置きながら、民衆の意向に基づく政党政治を実現していくべきであるという考え方\n資料\n天皇機関説\n資料\n“\n所謂機関説と申しまするのは、国家それ自身を一つの生命あり、それ自身に目的を有する恒久的の団体、即ち法律学上の言葉を以てせば一つの法人と観念いたしまして、天皇は此の法人たる国家の元首たる地位に在しまし、国家を代表して国家の一切の権利を総攬し給ひ、天皇が憲法に従つて行はせられまする行為が、即ち国家の行為たる効力を生ずると云ふことを云ひ表はすものであります。\n美濃部達吉\n考えよう\nQ1　史料の中で、天皇の行為が「国家の行為」になる条件が書かれた部分に線を引こう\nQ2　美濃部の考えに近いのはどっち？\n　　ア：天皇は憲法より上にいる　　イ：天皇も憲法に従う\nQ3　「イ」の考えが攻撃されたのはなぜだろう？\n原敬内閣\n★原敬が総理大臣になったことで、普通選挙運動が大盛り上がり\nしかし、労働運動・農民運動・社会主義運動がこれ以上盛り上がってしまう\n普通選挙の実現は叶わなかったが、納税要件を緩和させて、有権者数を増加させた\nデモクラシーの高揚\n大正デモクラシーの盛り上がりを受けて起こった運動を見てみよう\n「労働運動」\n1919年、国際労働機関（ILO）が設立された。これは労働問題を国際的に協議する国際連盟の姉妹機関のようなもの。\n賃上げや労働条件の改善を訴え、日本でも労働争議が多発。1920年には第1回メーデーが開催され、1921年には日本労働総同盟が結成。\n労働争議の発生件数と参加人数\nデモクラシーの高揚\n「農民運動」\n農村では小作料の減免を受ける小作争議が頻発。1922年には日本農民組合が結成。\n政府は農民の声に応える形で、1924年に小作調停法を制定し、小作人の権利を拡大。\n小作争議の発生件数と参加人数\n比べてみよう\n＜労働争議と小作争議の発生件数と参加人数を比較してみよう！＞\n労働争議\n小作争議\nデモクラシーの高揚\n「女性運動」\n1911年、平塚らいてうが青鞜社を結成したが、これは女性の権利を求める運動というより、文学がメインの団体だった。\n第一次世界大戦がきっかけで、女性の社会進出が拡大。1920年、市川房枝らが新婦人協会を創設。\n新婦人協会（平塚・市川）\nデモクラシーの高揚\n「女性運動」（つづき）\n新婦人協会の設立もあって、1922年、治安警察法が改正され、女性の政治演説会の参加が認められるようになった。\n1924年には婦人参政権獲得期成同盟会が結成されたが、女性参政権の獲得は戦後まで待つことになった。\n『青鞜』創刊の辞（平塚らいてう）「元始、女性は実に太陽であった。」\n補足\nデモクラシーの高揚\n「社会主義運動」\n1922年、コミンテルンの日本支部の日本共産党が結成。堺利彦、山川均らによって作られた。\n「全国水平社」\n1922年3月3日、部落差別を受け、苦しめられてきた人々約3000人が京都に集まり、自らの力による差別からの解放と、人間としての平等と自由の獲得をめざす全国水平社を創立した。\n水平社宣言の結び「人の世に熱あれ、人間に光あれ。」\n補足\n大正時代の経済\n日本は空前の好景気に沸いていた　なぜ？？\n◯第一次世界大戦によって、交戦中のヨーロッパからアジアへの輸出が止まったから\n＞アジアで日本の輸出が拡大　重化学工業・繊維業・造船業が急成長\n　貿易収支は大幅黒字「大戦景気」\n＞ヨーロッパが市場に戻ってきた　大戦が終わると大戦景気はSTOPし、\n　日本は戦後恐慌になってしまった\n関東大震災\n1923年9月1日午前11時58分　関東地方を中心に巨大地震が発生。\n地震そのものの死者よりも火災による死者の方が多く、死者は10万人を超えた。\n★1920年代前半は、戦後恐慌　⇨　震災恐慌　と恐慌が続く時代\n混乱の中で流言が広がり、多くの朝鮮人や中国人が殺害された\n補足\n清浦奎吾内閣\n…超然内閣（政党も国民も無視）\nなぜ？？\n関東大震災による社会不安の中、人々に自由を与えると何をするかわからないと考えたから\nみんなの意見を無視して政治をやったことで、結果的に周りを怒らせた\n護憲三派による第二次護憲運動が始まった\n護憲三派\n◯護憲三派とは？？\n第二次護憲運動をやっていた3つの政党のこと。\n立憲政友会の高橋是清\n憲政会の加藤高明\n革新倶楽部の犬養毅\n一方、清浦も政友本党を作ってこの流れに対抗\n総選挙は護憲三派の圧勝\n…第二次護憲運動によって政権交代が実現した\n犬養・高橋・加藤\n加藤高明内閣\n★◯普通選挙法を制定\n満25歳以上の男性全員に無条件で選挙権が与えられた\n★◯治安維持法を制定\n社会主義運動や労働運動を抑えるため\n考えよう\n原内閣\n「原内閣が普通選挙を実現できなかった理由を思い出そう」\n普通選挙の実施による、労働運動・農民運動・社会主義運動などの運動の盛り上がりを危惧　→断念\n加藤内閣\n「加藤内閣はなぜ実現できた？」\n普通選挙法とセットで運動を弾圧する法令（治安維持法）も出して、運動が盛り上がりすぎないようにした\n加藤高明内閣\n治安維持法を制定した理由はもう一つ！\nこの年、日本はソ連と国交を樹立　→日ソ基本条約\n国\n国内　「日本がソ連を国として認めた！社会主義の国を認めた！」\n⇨ 共産主義や社会主義が盛り上がってしまう…\n＞治安維持法によって抑止\n普通選挙法が制定されると、小作農や労働者を支持基盤とする政党が結成されるようになった（無産政党）"

選挙は\nまだ早い…\n原敬\nえーっ！\nせいや\n労働運動・農民運動・社会主義運動が盛り上がりすぎるのを心配。\n納税の条件をゆるめて\n有権者を増やすだけにした。\n5\n吉野作造の「民本主義」\n天皇主権が前提。\nでも政治は\n民衆の意向で！\n吉野作造\nれっきーの解説\n「天皇をやめろ」ではなく、天皇のもとで\n民衆のための政治をしよう！という考えニャ\n6\n美濃部達吉の「天皇機関説」\n天皇は国家の\n最高機関。\n天皇も憲法に従う！\n美濃部達吉\nプリントのQ2を考えよう！\n美濃部の考えに近いのは ア・イ どっち？\n7\nデモクラシーの高まり　いろんな人が声をあげた！\n労働運動\n賃上げを！\n1919\n国際労働機関（ILO）\n1920　第1回\nメーデー\n1921　日本労働総同盟\n農民運動\n小作料を\n下げて！\n小作争議\nが多発\n1922　日本農民組合\n1924　小作調停法\n女性運動\n女性にも\n参政権を！\n1911\n平塚らいてう\n（青鞜社）\n1920\n新婦人協会\n（市川房枝ら）\n参政権は戦後まで…\n全国水平社\n差別からの\n解放を！\n1922年3月3日\n京都に約3000人\n人間の平等と自由をめざす\nさらに1922年、\n日本共産党\nが結成（堺利彦・山川均ら）→ 社会主義運動も高まる\n8\n大戦景気 → 戦後恐慌\n大戦景気\n恐慌\n1914\n1920\nジェットコースター\nみたい！\nせいや\nヨーロッパが戦争中でアジアに輸出できない → 日本の輸出が急増！\n重化学工業・繊維・造船\nが急成長。でも戦後は\n戦後恐慌\nに。\n9\n1923年9月1日　関東大震災\n午前11時58分、関東で巨大地震。地震より\n火災\nの死者が多く、死者は\n10万人以上\n。\n1920年代前半は\n戦後恐慌 → 震災恐慌\nと不況が続く\n第4話\n歴史総合　大正デモクラシーと護憲運動\nついに普通選挙！…でも？\n1\n1924年　清浦奎吾内閣\n震災で社会不安だ。\n自由を与えたら\n何をするかわからん！\n清浦奎吾\nれっきーの解説\n政党も国民も無視する\n超然内閣\nの復活ニャ…\n2\n国民の怒りが爆発\n政党も国民も\n無視するな！\n国民\n清浦も\n政友本党\nをつくって対抗！\n3\n第二次護憲運動　「護憲三派」が立ち上がる！\n立憲政友会、\n参加する！\n高橋是清（立憲政友会）\n政党内閣を\n取りもどせ！\n加藤高明（憲政会）\n革新倶楽部も\nいくぞ！\n犬養毅（革新倶楽部）\n犬養さん、\n第1話にも\n出てた！\nせいや\n4\n総選挙の結果は…\n投票\n選挙で政権が\nかわったニャ！\nれっきー\n護憲三派の圧勝！\n運動によって\n政権交代\nが実現\n5\n1925年　加藤高明内閣の「アメ」\n普通選挙法\n満25歳以上の\n男性全員に\n選挙権じゃ！\n加藤高明\nやったー！\nお金の条件も\nなしだ！\nせいや\n6\n…あれ？\n待って、\n女性は…？\n?\nせいや\n女性の参政権は\n戦後まで\nおあずけニャ…\nれっきー\n第3話の女性運動（平塚らいてう・市川房枝）を思い出そう！\n7\n同じ年の「ムチ」\n治安維持法\nただし…\n社会主義運動や\n労働運動は取りしまる！\n加藤高明\n8\nなぜ「アメ」と「ムチ」をセットにしたの？\nソ連と国交を結んだし\n（日ソ基本条約）、\n社会主義が広がったら困る…\n加藤高明\nれっきーの解説\n普選で労働者も投票できる → 運動が盛り上がりすぎるかも。\n社会主義の国・ソ連を認めた → 共産主義が広がるかも。\nだから\n治安維持法でブレーキ\nをかけたニャ！\nまとめ\n原敬と加藤高明、何がちがった？\n原敬内閣\n運動の盛り上がりを心配して普通選挙は\n断念\n。納税条件をゆるめただけ。\n加藤高明内閣\n普通選挙法と\n治安維持法をセット\nにして普選を実現！\nその後\n小作農や労働者を支持基盤にする\n無産政党\nが生まれた。\n国民の声が政治を動かした！\nでも、自由をおさえる法律も\n生まれたんだね…\nせいや\nきみは、この時代を\nどう評価する\nニャ？\nれっきー"

        "t": "恐慌とファシズムの台頭\n教121p－\n世界恐慌とファシズムの広がり　確認問題\n組　　番　氏名＿＿＿＿＿＿＿＿＿＿＿＿\n１．できごとの順番を考えよう\n問1　次のⅠ〜Ⅲを古い順に並べたものを、下の①〜⑥から一つ選べ。\n（　　　　）\nⅠ　イギリスが連邦内の関税を下げ、連邦外には高い関税をかける経済圏をつくった。\nⅡ　ニューヨークのウォール街の株式市場で、株価が大暴落した。\nⅢ　フランクリン＝ローズヴェルトが大統領に就任し、ニューディール政策を始めた。\n①Ⅰ→Ⅱ→Ⅲ　②Ⅰ→Ⅲ→Ⅱ　③Ⅱ→Ⅰ→Ⅲ　④Ⅱ→Ⅲ→Ⅰ　⑤Ⅲ→Ⅰ→Ⅱ　⑥Ⅲ→Ⅱ→Ⅰ\n問2　次のⅠ〜Ⅲを古い順に並べたものを、問1の①〜⑥から一つ選べ。\n（　　　　）\nⅠ　ドイツがオーストリアを併合した。\nⅡ　ヒンデンブルク大統領の名でヒトラー内閣が誕生した。\nⅢ　ドイツ軍がラインラントの非武装地帯に進駐した。\n問3　次の文の出来事が入る位置を、年表中のＡ〜Ｃから一つ選べ。\n（　　　　）\n「ソ連が国際連盟に加盟し、常任理事国となった。」\n1929 世界恐慌 →【Ａ】→ 1933 ヒトラー内閣成立 →【Ｂ】→ 1938 ミュンヘン会談 →【Ｃ】→ 1939 独ソ不可侵条約\n２．世界恐慌 ― なぜアメリカの恐慌は世界に広がったのか\nアメリカ\n―資本投下→\nドイツ\n―賠償金→\nイギリス・フランス\n―（　ア　）→\nアメリカ\n問1　図中の（ア）に当てはまる語句として正しいものを一つ選べ。\n（　　　　）\n①賠償金の支払い　②戦債の返済　③資本の投下　④関税の引き上げ\n問2　アメリカで恐慌が起きた国内の要因として適当でないものを一つ選べ。\n（　　　　）\n①大量消費社会のもとで、ものを作りすぎる生産過剰が起きていた。\n②農業が不況となり、多くの農民が没落していた。\n③株式などへの過剰な投機ブームが起きていた。\n④ソ連の成立によって、アメリカ製品を売る市場が大きく広がっていた。\n問3　アメリカの恐慌がイギリス・フランスにまで広がったのはなぜか。「資金」「賠償金」の二語を用いて50字以内で説\n明せよ。\n問4　1920年代後半の日本の経済について述べた文として最も適当なものを一つ選べ。\n（　　　　）\n①大戦景気がそのまま続き、世界でもっとも景気のよい国となっていた。\n②関東大震災による震災恐慌に続いて金融恐慌も起こり、景気が悪化していた。\n③広大な植民地を使ったブロック経済によって、輸出が大きく伸びていた。\n④ニューディール政策にならって、大規模な公共事業で景気を回復させた。\n３．恐慌からの脱却 ― 各国はどう乗りきろうとしたか\n問1　ニューディール政策について述べた文として誤っているものを一つ選べ。\n（　　　　）\n①農業調整法で、補助金と引きかえに農作物の作付けを制限した。\n②テネシー川流域開発公社（TVA）による大規模な公共事業を行った。\n③ラジオ放送で国民に直接語りかけ、大統領が支持を広げた。\n④カリブ海諸国に軍事介入する「棍棒外交」を進めた。\n問2　ブロック経済について述べた次の文Ｘ・Ｙの正誤の組み合わせとして正しいものを一つ選べ。\n（　　　　）\nＸ　イギリスは、連邦内の関税を引き上げ、連邦外からの輸入の関税を引き下げた。\nＹ　フランスもイギリスにならい、フラン＝ブロックをつくった。\n①Ｘ正・Ｙ正　②Ｘ正・Ｙ誤　③Ｘ誤・Ｙ正　④Ｘ誤・Ｙ誤\n問3　ドイツ・イタリア・日本が、イギリスのようなブロック経済をつくれなかったのはなぜか。20字以内で答えよ。\n問4　1920〜30年代のソ連について述べた文として最も適当なものを一つ選べ。\n（　　　　）\n①スターリンは、世界規模で革命を起こす必要があるとする世界革命論を唱えた。\n②五カ年計画で工業化と農業の集団化を強制的に進め、工業生産を大きくのばした。\n③スターリンは計画経済をやめ、市場経済を全面的に取り入れた。\n④農業の集団化に抵抗する人々を説得するため、政府は弾圧を行わなかった。\n（50字以内）\n（20字以内）\n４．ファシズムの台頭 ― なぜ人々はヒトラーを支持したのか\n問1　ナチ党とヒトラーについて述べた次のａ〜ｄのうち、正しいものの組み合わせを一つ選べ。\n（　　　　）\nａ　1930年の選挙で、ナチ党はいきなり第1党となった。\nｂ　全権委任法を成立させ、ナチ党以外の政党を禁止して一党独裁を始めた。\nｃ　アウトバーン建設などの公共事業で雇用を生み出し、失業問題を解決した。\nｄ　ヴェルサイユ条約の軍備制限を守り、国際連盟にとどまり続けた。\n①ａ・ｃ　②ａ・ｄ　③ｂ・ｃ　④ｂ・ｄ\n問2　ナチ党が急に議席をのばした理由を、「ヴェルサイユ体制」「共産党」の二語を用いて60字以内で説明せよ。\n問3　ファシズムの特徴として適当でないものを一つ選べ。\n（　　　　）\n①反共産主義を掲げた。　　　　　　　②極端なナショナリズムを掲げた。\n③国家の利益よりも個人の人権を優先した。　④反対する勢力を暴力によって排除した。\n問4　1935年にイタリアがエチオピアに侵攻したとき、イギリスとフランスがとった対応として最も適当\nなものを一つ選べ。\n（　　　　）\n①国際連盟を脱退し、イタリアとの同盟を結んだ。\n②イタリアを刺激したくないため、具体的な経済制裁を行わなかった。\n③軍隊を送り、エチオピアを守った。\n④日本・ドイツとともに三国防共協定を結んだ。\n５．第二次世界大戦への道 ― 反共と反ファシズム\n問1　スペイン内戦について述べた文として最も適当なものを一つ選べ。\n（　　　　）\n①ドイツとイタリアは人民戦線政府を支援した。\n②ソ連はフランコ将軍の反乱軍を支援した。\n③イギリスとフランスは、ドイツやイタリアを刺激しないよう内戦に関わらなかった。\n④内戦は人民戦線政府の勝利に終わり、フランコは亡命した。\n資料　ミュンヘン会談（1938年）までの流れ\nドイツは、ドイツ人が多く住むチェコスロバキアのスデーテン地方の引き渡しを、“民族自決”を理由に要求した。イ\nギリス・フランス・ドイツ・イタリアによるミュンヘン会談が開かれ、イギリスとフランスはこの要求を認めた。ソ\n連はこの会談に招かれなかった。\n問2　資料のように、イギリスとフランスがヒトラーの要求を認めて戦争を避けようとした政策\nを何というか。\n（　　　　　　政策）\n問3　問2の政策について述べた文として最も適当なものを一つ選べ。\n（　　　　）\n①ムガル帝国のアクバルが行った「融和政策」と同じ意味の言葉である。\n②要求を突っぱねるとドイツと戦争になりかねない、という判断から行われた。\n③この政策の結果、ドイツはチェコスロバキアへの進出をやめた。\n④ソ連もこの政策に賛成し、イギリス・フランスと同盟を結んだ。\n問4　共産主義とファシズムは、指導者崇拝・一党独裁・計画経済などの点で似ている。それでもソ連とドイツが対立し\nていたのはなぜか。15字以内で答えよ。\n問5　【ふりかえり】対立していたドイツとソ連が、1939年に独ソ不可侵条約を結んだのはなぜか。資料を参考に、「ミュ\nンヘン会談」「共通の敵」の二語を用いて80字以内で説明せよ。\n（60字以内）\n（15字以内）\n（80字以内）"

        "t": "世界恐慌とファシズムの広がり　確認問題　解答・解説\n１．\n問1　【③】\nⅡ株価の大暴落（1929年10月24日「暗黒の木曜日」）→Ⅰイギリスのスターリング＝ブロック（1932年）→Ⅲフランク\nリン＝ローズヴェルトの大統領就任（1933年）。イギリスは恐慌に「真っ先に動いた」国で、アメリカのニューディー\nルはその後。\n問2　【④】\nⅡヒトラー内閣の誕生（1933年）→Ⅲラインラント進駐（1936年）→Ⅰオーストリア併合（1938年）。再軍備宣言\n（1935年）のあと、ヒトラーは少しずつ領土を広げていった。\n問3　【Ｂ】\nソ連の国際連盟加盟は1934年。ドイツ（1933年）や日本（1933年）が連盟を脱退したことも、ファシズムをおさえる\nためのソ連の加盟を後押しした。\n２．\n問1　【②】\nイギリス・フランスは第一次世界大戦中にアメリカからお金を借りており（戦債）、ドイツから受け取った賠償金をそ\nの返済にあてた。お金が「アメリカ→ドイツ→イギリス・フランス→アメリカ」と回っていたことがポイント。\n問2　【④】\nソ連の成立は、資本主義国にとっては市場が減ったことを意味する（世界的要因）。①〜③はプリントの「アメリカ国\n内の要因」。\n問3　（解答例）\nアメリカの資金で賠償金を払っていたドイツが払えなくなり、それを当てにした英仏も打撃を受けたから。（48字）\n採点のポイント：①アメリカの資金でドイツが賠償金を支払っていた　②賠償金が止まり英仏が影響を受けた　の2\n点。\n問4　【②】\n日本は関東大震災（1923年）後の震災恐慌、1927年の金融恐慌と不況が続き、そこへ世界恐慌が重なった。③ブロッ\nク経済は植民地の広いイギリス・フランス、④ニューディールはアメリカの政策。\n３．\n問1　【④】\n「棍棒外交」はセオドア・ローズヴェルトの方針。フランクリン＝ローズヴェルトは反対に、ラテンアメリカ諸国に\n干渉しない「善隣外交」を行い、ソ連とも国交を樹立した。\n問2　【③】\nＸは逆。イギリスは連邦内の関税を下げ、連邦外には高い関税をかけた（スターリング＝ブロック）。Ｙは正しい。\n問3　（解答例）\n広大な植民地を持っていなかったから。（18字）\nブロック経済からしめ出された3国は経済的に追いつめられ、のちに枢軸国としてまとまっていく。\n問4　【②】\n①世界革命論はトロツキー（スターリンは一国社会主義論）。③スターリンは計画経済体制をとり、市場経済をやめた\n（部分的に市場経済を取り入れたのはレーニン）。④抵抗する者は容赦なく弾圧され、大粛清も行われた。\n４．\n問1　【③】\nａ　1930年の選挙では第2党。第1党になったのは1932年の選挙。　ｄ　1933年に国際連盟脱退を表明し、1935年に再軍\n備宣言をしてヴェルサイユ条約の軍備制限を破棄した。\n問2　（解答例）\n巧みな宣伝でヴェルサイユ体制への不満をあおり、共産党の進出を警戒する軍部や資本家もナチ党に期待したから。\n（52字）\n問3　【③】\nファシズムは全体主義＝個人の人権を無視して、国や民族の利益を優先する考え方。③は逆の内容。\n問4　【②】\n国際連盟は経済制裁を宣言したが、イギリス・フランスはイタリアを刺激したくないため具体的な制裁を行わず、\n1936年にエチオピアは併合された。孤立したイタリアはドイツ・日本に接近し、1937年に日独伊三国防共協定を結ん\nだ（④はイギリス・フランスではなくイタリアの行動）。\n５．\n問1　【③】\n①②は逆。ドイツ・イタリアはフランコを、ソ連は人民戦線政府を支援した。④内戦はフランコ側の勝利に終わり、\nフランコの独裁体制が成立した。\n問2　【宥和（政策）】\n「融和政策」（ムガル帝国のアクバル）と読みは同じでも意味がまったく違うので、漢字に注意。\n問3　【②】\n③ドイツは翌1939年にチェコスロバキアを解体して支配下においた。④ソ連はミュンヘン会談に招かれず、かえって\nドイツと手を組んだ。\n問4　（解答例）\nナチ党が反共産主義だったから。（15字）\n問5　（解答例）\nミュンヘン会談に招かれなかったソ連は、英仏がファシズムと共産主義の両方をつぶしたいのではと疑い、英仏を共\n通の敵とするドイツと手を組んだから。（70字）\n採点のポイント：①ソ連がミュンヘン会談に招かれなかった　②英仏への不信　③英仏がドイツ・ソ連の共通の敵に\nなった　の3点。"

        "t": "第1話\n歴史総合　世界恐慌とファシズムの広がり\nアメリカのくしゃみで世界がカゼ！？\n1  戦間期へようこそ！\nせいや（高校生）\nれっきー（物知りネコ）\n第一次世界大戦が\n終わって平和に\nなったんでしょ？\nそれが、ここから\n暗い時代が\n始まるニャ…\n2  1929年10月24日　暗黒の木曜日\nニューヨークのウォール街で\n株価が大暴落！\n投資家\n株が紙くずに\nなった〜！\n3  お金はぐるぐる回っていた\nアメリカ\n資本投下\n→\nドイツ\n賠償金\n→\nイギリス・フランス\n戦債返還\n→\nアメリカ\nれっきー\nお金の流れを\nたどってみるニャ\n4  せいやの疑問\n?\nせいや\nれっきー\nアメリカの話なのに\nなんでヨーロッパ\nまで不景気に？\nドイツはアメリカの\nお金で賠償金を\n払ってたニャ\n5  賠償金がSTOP！\nドイツ\nイギリス\nフランス\nもう払え\nないよ…\n賠償金が\n来ない！？\nうちも\n困る！\n6  アメリカの中にも原因が\n・大量消費で生産過剰（作りすぎ）\n・農業不況で農民が没落\n・株への過剰な投機ブーム\nれっきー\n作りすぎ＋お金の\nかけすぎニャ\n7  世界恐慌\n会社が次々に倒産\n失業率は最大で約25％！\n失業者たち\n仕事が\nない…\n8  そのころ日本は？\n関東大震災 → 震災恐慌\n＋ 金融恐慌\n＋ 世界恐慌\nせいや\n恐慌の\nトリプル\nパンチ！？\n9  まとめ\nせいや\nれっきー\nお金がつながってる\nから、1つの国の\n不景気が世界に\n広がったんだ！\n世界恐慌の\nはじまりニャ！\n第2話\n歴史総合　世界恐慌とファシズムの広がり\n恐慌から抜け出せ！各国の作戦\n1  真っ先に動いたのはイギリス\nイギリス\n?\nせいや\n作戦1！\n金本位制を\nやめるぞ！\nきんほんいせい？\n2  金本位制ってなに？\n持っている金の量だけ\nお金（紙幣）を発行できるしくみ\nれっきー\n金庫の金が\nお金の\n「裏づけ」ニャ\n3  なぜやめたの？\n各国\n通貨を売って金に交換\n→\nまだ金本位制の国\n→ 金がどんどん海外に流出！\nだからイギリスは離脱。他の国も続いた\n4  作戦2：ブロック経済\nイギリス連邦の国\n低い関税\n→\nイギリス\n連邦の外の国\n高い関税\n→\nイギリス\nイギリス\n仲間内だけで\n売り買い\nするぞ\n5  クラスでたとえると…\n学園祭で「同じクラスの子には100円、\n他のクラスの子には500円」で売る！\n→ 他のクラスの店は売れなくなる…\nせいや\nずるい！\n6  スターリング＝ブロックとフラン＝ブロック\nイギリス\nフランス\n共通点は広大な植民地\nスターリング\n＝ブロック\nうちも\nフラン＝\nブロック！\n7  持たざる国\nドイツ\nイタリア\n日本\n植民地が\nない！\n売る場所\nがない！\n追いつめ\nられる…\n8  アメリカ：ニューディール\nフランクリン＝ローズヴェルト\n・農業調整法（AAA）\n・TVAで公共事業\n政府が経済に\nどんどん\n手を出すぞ！\n9  それでも大人気！\nローズヴェルト\nラジオで国民に直接語りかけた\n外交はラテンアメリカに干渉しない善隣外交\nせいや\n国民のみなさん、\n一緒に乗りこえ\nましょう！\n声が届くと\n安心する！\n第3話\n歴史総合　世界恐慌とファシズムの広がり\nソ連とドイツ　強い指導者の登場\n1  レーニンのあとは？\nスターリン\nトロツキー\nソ連だけで\n社会主義は\nできる！\n世界中で\n革命が\n必要だ！\n2  スターリンの政策\n計画経済：生産から消費まで\n政府がすべて管理\n五カ年計画：工業化と農業の集団化\nスターリン\n全部国が決める\n3  でも実は…\n集団化は強制。逆らう人は弾圧\n大粛清で多くの人が犠牲に\nれっきー\n成長の裏で多くの\n人が苦しんだニャ\n4  ソ連すごい…？\n資本主義の国々\nせいや\n恐慌なのに\nソ連は成長\nしてる！\n日本やドイツも\nまねし始めた\nんだね\n5  ドイツに大打撃 → ナチ党の急な躍進\nヒトラー\n国民\n世界恐慌でドイツ経済は壊滅的に\n1930年 第2党 → 1932年 第1党\n巧みな宣伝で不満をあおった\n共産党を警戒する軍部・資本家も期待\nヴェルサイユ\n体制が悪い！\nそうだ\nそうだ！\n6  一党独裁へ\n1933 ヒトラー内閣→\n国会議事堂放火事件\n共産党を弾圧\n→\n全権委任法\nナチ党以外の政党を禁止＝一党独裁\n1934年 ヒトラーが総統（大統領＋首相）に\nヒンデンブルク大統領\nヒトラーを\n首相に任命する\n7  支持された理由\nアウトバーン建設など\n公共事業で失業を解決\n国民\n仕事ができた！\n8  その裏側で\nユダヤ人への徹底した迫害\n障害者や同性愛者も迫害\nせいや\nひどすぎる…\n9  再軍備\n1933年 国際連盟脱退を表明\n1935年 再軍備宣言\nヒトラー\n軍備制限は\n破棄だ！\n第4話\n歴史総合　世界恐慌とファシズムの広がり\n反共と反ファシズム　そして戦争へ\n1  イタリアのエチオピア侵攻\nイタリア\n1935年 侵攻 → 1936年 併合\n英仏は刺激したくなくて\n具体的な制裁をしなかった\n植民地が\n欲しい！\n2  孤立した国どうし\nイタリア\nドイツ\n日本\n1937年日独伊三国防共協定\n共通の敵は共産主義\n3  ファシズムとは？\n反共産主義・極端なナショナリズム・\n全体主義（個人の人権より国や民族の利益）\n反対する勢力を暴力で排除\nれっきー\nソ連の共産主義と\n似ている所も\nあるけど…\n4  似た者同士なのに対立\nソ連は1934年に国際連盟に加盟\nソ連\nドイツ\n反ファシズム！\n反共産主義！\n5  スペイン内戦\nフランコ将軍\n独・伊 → フランコを支援\nソ連・義勇兵 → 政府を支援\n英・仏は関わらず\n→ フランコの勝利\n人民戦線\n政府を倒す！\n6  ヒトラー動き出す\n1935 ザール→\n1936 ラインラント進駐→\n1938 オーストリア併合\nヒトラー\n次は\nスデーテンだ！\n（民族自決）\n7  ミュンヘン会談\n宥和政策（融和政策とはちがう！）\nイギリス\nフランス\n戦争に\nなるよりは…\n要求を\n認めます\n8  呼ばれなかったソ連\nスターリン\nれっきー\n英仏は\n共産主義も\nつぶす気か？\n敵の敵は\n味方ニャ\n9  1939年　独ソ不可侵条約\nドイツ\nソ連\n→ 第二次世界大戦へ\nせいや\n手を組もう\nいいだろう\n恐慌が\n独裁と戦争を\nうんだんだ…"

        "t": "恐慌とファシズムの台頭                                      \n政党政治の行き詰まりと満洲事変 \n１．昭和の幕開けと金融恐慌 \n1926 年、大正天皇が亡くなり元号が昭和に変わる。 \nこの頃は、衆議院で議席の最も多い政党が内閣をつくるのがルールになっていた＝憲政の常道 \n二大政党：立憲政友会 と 憲政会（のちの立憲民政党） \n憲政の常道の時期（1920 年代後半～1930 年代前半）の内閣は次の6 つ \n内閣 \n政党 \nおもなできごと \n1 \n加藤高明\nかとうたかあき\n内閣 \n憲政会 \n普通選挙法・治安維持法（1925 年） ＊第6 章で学習 \n2 \n第1 次若槻礼次郎\nわかつきれいじろう\n内閣 \n憲政会 \n金融恐慌 \n3 \n田中義一\nたなかぎいち\n内閣 \n立憲政友会 \n第1 回普通選挙・山東\nさんとう\n出兵・張作霖\nちょうさくりん\n爆殺\nばくさつ\n事件 \n4 \n浜口雄幸\nはまぐちおさち\n内閣 \n立憲民政党 \n金解禁\nきんかいきん\n・昭和恐慌・統帥権干犯\nとうすいけんかんぱん\n問題 \n5 \n第2 次若槻礼次郎内閣 \n立憲民政党 \n満洲事変 \n6 \n犬養毅\nいぬかいつよし\n内閣 \n立憲政友会 \n満洲国の建国・五・一五事件 \n金融恐慌 なぜ起こった？？ \n背景：第一次世界大戦後の 戦後恐慌 \nと、関東大震災による 震災恐慌 \nで、銀行の経営はボロボロ… \n1927 年：議会での大蔵大臣の失言から、一部の銀行の経営が危ないことが明るみに \n→「あの銀行、つぶれるらしい…」と、預金を引き出そうとする人々が銀行に殺到 \n→お金のない銀行は休業・倒産があいつぐ＝ 金融恐慌 \n＊台湾銀行（植民地台湾の経済を支える政府系の特別な銀行）も経営危機に \n若槻内閣は、天皇の緊急勅令\nきんきゅうちょくれい\nを出してもらい台湾銀行を救おうとする \n→枢密院\nすうみついん\nが反対  なぜ？？ \n＞若槻内閣の協調外交（幣原\nしではら\n外交）を「中国に弱腰だ」と不満に思っていたから →若槻内閣は総辞職 \n次は田中義一内閣（立憲政友会） 大蔵大臣：高橋是清\nたかはしこれきよ\n① モラトリアム \n（支払猶予令）：銀行からの預金の払い戻しを一時的にストップ \n②日本銀行から巨額の救済融資 →金融恐慌はおさまる \n２．田中義一内閣 ―普通選挙と中国への出兵― \n1928 年：第1 回普通選挙（普通選挙法の制定は1925 年の加藤高明内閣） \n→社会主義運動・労働運動を進める無産政党\nむさんせいとう\nから8 人が当選 →政府にとっては大きな衝撃… \n 治安維持法 \nを改正し、最高刑を死刑に＝社会主義運動などの取り締まりを強化 \n 山東出兵 \n（1927～28 年） \n名目：中国の山東省に住む日本人を守るため \n本当のねらい：蒋介石\nしょうかいせき\n率いる国民政府軍の北伐\nほくばつ\nをくい止め、満洲の日本の権益を守ること \n                                      氏名＿＿＿＿＿＿＿＿＿ \n出兵中に日中両軍が衝突（済南\nさいなん\n事件） \n 張作霖 \n爆殺事件（1928 年） \n張作霖：満洲を支配していた軍閥\nぐんばつ\nのリーダー。日本と協力関係にあった \n→しかし北伐軍に敗れ、本拠地の奉天\nほうてん\n（満洲）へ引き上げる \n関東軍\nかんとうぐん\n（満洲に置かれた日本軍）「張作霖を支えるより、取り除いて満洲を日本の支配下に置く方がよい」 \n ↓ 奉天へ戻る張作霖を列車ごと爆破 \nところが予想外の結果に… 息子の張学良\nちょうがくりょう\nが国民政府に合流（父を殺した日本と対立する道へ） \n田中内閣は真相を隠し、「満洲某\nぼう\n重大事件」とよんでごまかす \n→昭和天皇の不信を買い、田中内閣は総辞職 \n３．浜口雄幸内閣 ―昭和恐慌と統帥権干犯問題― \n浜口雄幸内閣（立憲民政党＝憲政会と政友本党が合同した政党） \n1930 年： 金解禁 \n＝金の輸出を解禁し、金本位制に戻す（大蔵大臣：井上準之助\nいのうえじゅんのすけ\n） \nねらい：為替\nかわせ\n相場を安定させて輸出を伸ばし、日本経済を立て直す ＋ 緊縮財政\nきんしゅくざいせい\nで政府の支出を減らす \n ↓ ところが…大失敗  なぜ？？ \n＞1929 年に始まった世界恐慌の時期と重なってしまったから \n輸出が激減 → 都市：企業の倒産があいつぎ、失業者があふれる \n      → をほとんど受けなかった。\n問4　統帥権干犯問題について述べた次の文Ｘ・Ｙの正誤の組み合わせとして正しいものを一つ選べ。\n（　　　　）\nＸ　ロンドン海軍軍縮条約は、主力艦（戦艦）の保有量を制限する条約だった。\nＹ　海軍軍令部や野党・右翼は、政府が兵力を決めたのは天皇の統帥権を犯すものだと批判した。\n①Ｘ正・Ｙ正　②Ｘ正・Ｙ誤　③Ｘ誤・Ｙ正　④Ｘ誤・Ｙ誤\n５．満洲事変と政党政治の終わり\n問1　柳条湖事件について述べた文として最も適当なものを一つ選べ。\n（　　　　）\n①関東軍が南満洲鉄道の線路を爆破し、中国軍のしわざだとして軍事行動を始めた。\n②中国軍が南満洲鉄道の線路を爆破したため、関東軍が反撃した。\n③政府の命令を受けて、関東軍が満洲の主要部を占領した。\n④国際連盟の調査団が、事件の真相を調べるために派遣された。\n問2　満洲国について述べた文として誤っているものを一つ選べ。\n（　　　　）\n①1932年、犬養内閣のときに建国された。\n②清朝最後の皇帝溥儀が執政（のち皇帝）となった。\n③実権は現地の人々がにぎり、日本は政治にかかわらなかった。\n④「五族協和」をスローガンとした。\n問3　1932年5月15日に、海軍の青年将校らが犬養首相を暗殺した事件を何というか。\n（　　　　　　　　事件）\n問4　犬養内閣の高橋是清蔵相の政策について述べた文として誤っているものを一つ選べ。\n（　　　　）\n①金輸出再禁止で円安となり、綿製品などの輸出が急増した。\n②関税を上げて輸入をおさえ、朝鮮・満洲との結びつきを強めた。\n③緊縮財政で政府の支出を減らし、景気を回復させた。\n④欧米諸国より早く恐慌から回復し、重化学工業が発展した。\n問5　【ふりかえり】「政党の時代」が短く終わったのはなぜか。「恐慌」「軍部」の二語を用いて80字以内で説明せよ。\n（50字以内）\n（80字以内）"

1年9月18日　柳条湖事件\n関東軍が線路を爆破→\n「中国軍のしわざだ！」→\n軍事行動を開始\n自分で窓を割って「隣のクラスがやった！」と言うのと同じ＝自作自演\n4  満洲事変\n関東軍は満洲の主要部を占領\n政府は不拡大方針だったが\n軍を止められなかった\n若槻首相\n止まらない…\n5  1932年　満洲国\n溥儀（表の代表）\n関東軍（裏で実権）\n＝傀儡国家\n「五族協和」\n執政に\nなりました\n動かすのは\nわれわれだ\n6  1932年5月15日\n犬養首相\n海軍の青年将校\n＝五・一五事件\n犬養は満洲国の承認に慎重だった\n話せば\nわかる\n問答無用！\n7  政党内閣の終わり\n政党内閣（憲政の常道）の時代は終わり\n戦後まで復活しない\nせいや\n政党の時代、\n短かった…\n8  一方、高橋是清は\n高橋是清\n円安で輸出を伸ばし\nいち早く恐慌から脱出\n①金輸出再禁止\n②関税で輸入をおさえる\n③積極財政！\n9  まとめ\nせいや\nれっきー\n恐慌で政党が信頼を\nなくして、軍部が\n動き出したんだね\n次は軍部が\n政治を動かす\n時代ニャ"

        "t": "恐慌とファシズムの台頭                                      \n軍部の台頭と日中戦争 \n前回：五・一五事件（1932 年）で犬養首相が暗殺され、政党内閣の時代（憲政の常道）は終わった \n１．軍部の台頭と国際社会からの孤立 \n五・一五事件のあとは、海軍出身の首相が2 代続く（斎藤実\nさいとうまこと\n → 岡田啓介\nおかだけいすけ\n） \n斎藤実内閣：1932 年、日満議定書\nにちまんぎていしょ\nを結んで満洲国を承認 \n流れ：満洲事変（第2 次若槻\nわかつき\n内閣）→満洲国の建国（犬養\nいぬかい\n内閣）→満洲国の承認（斎藤内閣） \n国際連盟からの脱退 \n中国は日本の行動を国際連盟に訴える \n→連盟は リットン調査団 \nを派遣 \n報告：満洲での日本の権益にはある程度配慮する。しかし、満洲国は現地の人々が\n自分たちでつくった国とはいえない →認めない \n1933 年：連盟総会で、満洲国を認めず、日本軍の撤退を求める勧告案を可決 \n→日本は 国際連盟 \nからの脱退を通告 \n1933 年：中国と塘沽\nタンクー\n停戦協定を結び、満洲事変はいったん終わる \n読み解き：右の風刺画で、日本の手がにぎりつぶしているものは何だろう？ \n日本の行動を非難する風刺画\n（1933 年アメリカ） \n（『明解歴史総合』p.127） \n岡田啓介内閣 \n美濃部達吉\nみのべたつきち\nの 天皇機関説 \n：「主権は国家にあり、天皇は国家の最高機関として憲法に従って統治する」 \n→1935 年、「天皇を軽んじる説だ」と攻撃される（天皇機関説事件） \n→政府は国体明徴\nめいちょう\n声明を出して天皇機関説を否定。美濃部は貴族院議員を辞職 \n＊それまで大学などで広く認められていた学説まで否定され、自由な言論・学問がおさえられていく \n二・二六事件 \nこの頃、陸軍の中では2 つのグループが対立していた \n皇道派\nこうどうは\n統制派 \n天皇を中心とした国家の改造を主張。クーデタなどの直\n接行動も辞さない。苦しむ農村の救済を重視。青年将校\nが多い \n陸軍内部の統制を重視。官僚や財閥と協力し、総力戦に\n備える国家（高度国防国家）づくりを主張。東条英機\nとうじょうひでき\nら\nが中心 \n統制派が優勢に →追いつめられた皇道派の青年将校がクーデタを起こす \n1936 年2 月26 日： 二・二六事件 \n約1400 人の兵を率いて首相官邸などを襲撃 \n                                      氏名＿＿＿＿＿＿＿＿＿ \n→高橋是清\nたかはしこれきよ\n蔵相、斎藤実内大臣（前首相）らを殺害し、東京の中心部を占拠 \n→昭和天皇は激怒し、反乱軍として鎮圧\nちんあつ\nを命じる \nその後：政治家たちは「軍部に逆らえば命が危ない」 \n→軍部の顔色をうかがう政治へ \n読み解き：右の風刺画は何を伝えようとしているだろうか？ \n広田弘毅\nひろたこうき\n内閣（1936 年） \n① 軍部大臣現役武官制 \nを復活：陸軍・海軍大臣は現役の軍人に限る \n→軍部が大臣を出さなければ内閣がつくれない＝内閣をつくるのも、つぶすのも\n軍部の思いのまま \n②1936 年：日独防共協定：共産主義の国際組織（コミンテルン）に対抗 \n→1937 年にイタリアも加わる（日独伊三国防共協定） \n＊広田は戦後の東京裁判でA 級戦犯とされ、文官（軍人ではない人）としてただ一人死刑に \n＊1937 年：文部省が『国体の本義\nほんぎ\n』を発行し、天皇中心の国家観を学校などで広める \n２．日中戦争はなぜ始まった？ \n満洲事変はいったん終わったが…日本軍は資源や市場を求めて華北\nかほく\n（中国北部）へ進出 \n中国：国民政府の蒋介石\nしょうかいせき\nは、日本よりも中国共産党との内戦を優先 \n→中国は国内で分裂していて、日本に対抗できない \n1936 年： 西安事件 \n張学良\nちょうがくりょう\nが西安で蒋介石を監禁し、「今戦うべきは共産党ではなく日本だ」と内戦の停止を説得 \n→蒋介石は、共産党と協力して日本に対抗する方向へ \n1937 年7 月：北京郊外で日中両軍が衝突＝ 盧溝橋事件 \n →日中戦争に突入 \n＊日本はこの戦争を「北支\nほくし\n事変」→「支那\nし\nな\n事変」とよんだ なぜ「戦争」ではなく「事変」？？ \n＞宣戦布告をしなかったから \n 「戦争」になると、アメリカの中立法で、戦争に必要な物資を輸入できなくなるおそれがあった \n1937 年9 月：第2 次国共合作\nこっきょうがっさく\n（国民党と共産党が再び協力し、日本に対抗） \n日本軍は上海や首都南京を占領（南京では捕虜や住民が多数殺害された＝南京事件） \n国民政府は首都を移しながら抵抗を続ける：南京 → 武漢\nぶかん\n → 重慶\nじゅうけい\n国民政府はなぜ降伏しなかった？？ \n＞アメリカ・イギリス（ソ連も）が国民政府を支援したから →日中戦争は長期化（泥沼化） \n恐慌とファシズムの台頭                                      \n軍部の台頭と日中戦争 \n→日本国内では反英・反米の感情が強まり、のちの太平洋戦争へとつながっていく \n戦時体制へ（第1 次近衛文麿\nこのえふみまろ\n内閣） \n1938 年： 国家総動員法 \n：議会の承認なしに、戦争のために国民や物資を動員できる \n1938 年：東亜\nとうあ\n新秩序声明：日本・満洲国・中国が協力して新しいアジアの秩序をつくると呼びかける \n→しかし、日本の行動は国際的に非難される \n1939 年：アメリカが日米通商航海条約の廃棄を通告（1940 年に失効） \n→アメリカが日本に経済制裁をできるようになる →物資不足・物価の上昇 \n→砂糖・マッチなどの切符制、米の配給制が始まり、くらしは苦しくなる \n３．日本はなぜドイツにならった？ \n1939 年：第二次世界大戦が始まる →1940 年、ドイツは西ヨーロッパの大部分を占領 \n日本「第一次世界大戦で負けてボロボロだったドイツが、ここまで強くなった！ドイツにならおう」 \n1940 年：近衛文麿を中心に新体制運動：ドイツのような強力な指導体制の国家をめざす \n＊国民も期待：経済的に追いつめられた生活を変えてくれるのでは… \n→ 大政翼賛会 \nの結成：政党は解散して合流。労働組合や婦人団体、町内会・隣組\nとなりぐみ\nなども組み込まれる \n＝国をあげて戦争に協力する体制ができあがる \n1941 年：小学校が国民学校に改められる \n朝鮮・台湾：日本語の使用や神社参拝などを強制し、「日本人」として戦争に協力させる 皇民化政策 \n第2 次近衛文麿内閣（1940 年） \n 北部仏印進駐 \n：フランス領インドシナ北部（現在のベトナム北部）に軍を進める  なぜ？？ \n＞アメリカ・イギリスが仏印\nふついん\nなどを通って国民政府に物資を送るルート（援蒋\nえんしょう\nルート）を断ち切るため \n1940 年： 日独伊三国同盟 \n：アメリカをけん制するための軍事同盟 \n→アメリカは強く反発し、くず鉄・鉄鋼の輸出禁止など経済制裁を強める \n→日本の物資不足はさらに深刻に… →太平洋戦争へ \n 世界史と日本史 \n7-1 で学んだ日独伊三国防共協定（1937 年）は、共産主義（ソ連）が共通の敵だった。ところが1939\n年、ドイツはそのソ連と独ソ不可侵条約を結ぶ。日本の平沼騏一郎\nひらぬまきいちろう\n内閣は「欧州情勢は複雑怪奇\nかいき\n」と言って\n総辞職した。 "

しくみを強めた。\n問2　1939〜41年のできごとについて述べた次のａ〜ｄのうち、正しいものの組み合わせを一つ選べ。\n（　　　　）\nａ　アメリカが日米通商航海条約の廃棄を通告し、日本に経済制裁ができるようになった。\nｂ　物資は豊富にあり、米の配給制などは行われなかった。\nｃ　政党は解散して大政翼賛会に合流し、町内会・隣組なども組み込まれた。\nｄ　新体制運動は、アメリカのような議会政治をめざす運動だった。\n①ａ・ｃ　②ａ・ｄ　③ｂ・ｃ　④ｂ・ｄ\n問3　日本が北部仏印進駐を行ったのはなぜか。「援蒋ルート」の語を用いて30字以内で説明せよ。\n問4　1940年の日独伊三国同盟の結果について述べた文として最も適当なものを一つ選べ。\n（　　　　）\n①アメリカは強く反発し、くず鉄・鉄鋼の輸出禁止など経済制裁を強めた。\n②アメリカは日本と協力し、物資の輸出を増やした。\n③ソ連はすぐにドイツ・日本と戦争を始めた。\n④日本の物資不足は解消された。\n問5　1939年、平沼騏一郎内閣が「欧州情勢は複雑怪奇」と言って総辞職するきっかけとなったできごと\nとして最も適当なものを一つ選べ。\n（　　　　）\n①ドイツがソ連と独ソ不可侵条約を結んだ。　②ミュンヘン会談が開かれた。\n③日独伊三国防共協定が結ばれた。　　　　　④日本が国際連盟からの脱退を通告した。\n問6　【ふりかえり】日本が国際社会から孤立していったのはなぜか。「満洲国」「日中戦争」「ドイツ」の三語を用いて80\n字以内で説明せよ。\n（50字以内）\n（30字以内）\n（80字以内）"

ようなもの\n議会の承認なしに\n国民や物資を\n動員できる\n2  東亜新秩序\n日本・満洲国・中国で\n新しいアジアの秩序を！\n→ 国際的には非難される\nアメリカ\n認められ\nない！\n3  アメリカの経済制裁\n1939年 日米通商航海条約の廃棄を通告\n→ 物資不足・物価の上昇\n→ 切符制・米の配給制\n国民\nくらしが\n苦しい…\n4  ドイツが強い！\n1939年 第二次世界大戦\n1940年 ドイツが\n西ヨーロッパの\n大部分を占領\n日本\nドイツに\nならおう！\n5  新体制運動\n近衛文麿\n国民も期待…\nドイツのような\n強力な指導体制を\nつくろう\n6  大政翼賛会\n政党→\n労働組合→\n町内会・隣組\nみんな解散して大政翼賛会へ合流\n＝国をあげて戦争に協力する体制\n7  国民学校と皇民化政策\n1941年 国民学校\n朝鮮・台湾では\n日本語・神社参拝を強制\n＝皇民化政策\nせいや\n「日本人」に\nさせられた…\n8  1940年　北部仏印進駐\n米英が国民政府に物資を送る\n援蒋ルートを断ち切る！\n日本軍\n補給を\n断つ！\n9  日独伊三国同盟\n日本\nドイツ\nイタリア\nアメリカをけん制\n→ アメリカは反発し経済制裁を強化\n→ 太平洋戦争へ\nアメリカ\n許さない！"

史総合』p.131 図 5（グラフ内の表記『太平洋戦争の記憶 昭和 15 年』）\n【何が書いてある？】1940 年に日本が輸入した資源の割合。鉄類は\ng 69.9 ％、石油は h 76.7 ％が\ni アメリカ合衆国 からだった。石油の\n残りは、j オランダ領東インド （今のインドネシア）が 14.5％、\nその他が 8.8％。\n【当時の背景】日本は日中戦争を続けるため、軍艦・飛行機・戦車を動かす\n石油と、武器をつくる鉄の多くをアメリカから買っていた。中国を支援する\nアメリカに、戦争の資源をたよっていたことになる。1941 年 7 月の南部仏印進駐に\n対し、アメリカは石油の輸出を全面禁止した。軍部は「石油がなくなる前に、\nオランダ領東インドなど南方の資源を手に入れるべきだ」と考え、アメリカとの\n戦争へ進んでいった。\nみんなで考えよう\n独ソ不可侵条約は、ソ連にとって「かしこい選択」だったのか、\n「まちがい」だったのか？\n見る視点 ミュンヘン会談に呼ばれなかったソ連は、英・仏をどう見ていた？\n見る視点 条約のあと、ポーランドは？ 2 年後のソ連自身はどうなった？（②）\nみんなで考えよう\n1941 年の日本に、アメリカとの戦争をさける道はあったか？\n見る視点 見る視点 グラフを見て、アメリカと戦うと資源はどうなる？\nハル=ノートを受け入れたら、日本の軍・国民、中国の人々はどうなった？\n自分の考え（かしこい／まちがい と、その理由）\n占領されたフランスの人々にとって、ドイツに「従う」のと\n「抵抗する」のと、どちらが正しい選択だったか？\n見る視点 考える。\n見る視点 家族の命やくらしを守ることと、国の自由を取りもどすことの両方から\n地図で、1940〜42 年のフランスのまわりはどうなっている？\n自分の考え（あった／なかった と、その理由）\n...................................................................................................................\n...................................................................................................................\n...................................................................................................................\n自分の考え（従う／抵抗する と、その理由）\n...................................................................................................................\nとなりの人の考え\n...................................................................................................................\n...................................................................................................................\nとなりの人の考え\n...................................................................................................................\n...................................................................................................................\n...................................................................................................................\n.................................................................................................... つ選べ。\n①ソ連と手を組んで、アメリカをけん制するため。\n②ソ連とともに、ドイツと戦うため。\n③アメリカとの戦争を終わらせる仲介を、ソ連にたのむため。\n④満洲国をソ連にゆずるため。\n問2 1940\n年、日本は石油の76.7％、鉄類の69.9％をアメリカから輸入していた（プリント裏③のグラ\n（ ）\nフ） 。これについて述べた次の文Ｘ・Ｙの正誤の組み合わせとして正しい\nものを一つ選べ。\nＸ 日本は、中国を支援するアメリカに、戦争に必要な資源の多くをたよっていた。\nＹ アメリカに石油を止められても、オランダ領東インドからこれまでどおりの量を輸入できたので、影響は小さか\nった。\n①Ｘ正・Ｙ正 ②Ｘ正・Ｙ誤 ③Ｘ誤・Ｙ正 ④Ｘ誤・Ｙ誤\n問3 1941年7月の南部仏印進駐から、日本がアメリカとの開戦へ向かった流れを、 「資源」 「石油」の二語を用いて60字\n以内で説明せよ。\n（60字以内）\n問4 東条英機内閣がハル=ノートを「最後通牒」と受け止めた理由として最も適当なものを一つ選べ。 （ ）\n①アメリカが、日本の本土を攻撃すると予告していたから。\n②石油を売る代わりに、ソ連と戦うよう求めていたから。\n③日独伊三国同盟を、さらに強め\nるよう求めていたから。\n④中国・仏印からの全面撤退や、満洲国などを認めないことを求めており、それまでの戦争で得たものをすべて手放\nすことになるから。\n５．太平洋戦争の始まり ― 世界規模の戦争へ\n問1 1941年12月8日の日本軍の行動について述べた次のａ〜ｄのうち、正しい\nものの組み合わせを一つ選\n（ ）\nべ。\nａ 陸軍がイギリス領のマレー半島に上陸した。\nｂ 陸軍がソ連領のシベリアに攻めこんだ。\nｃ 海軍がハワイの真珠湾を奇襲攻撃した。\nｄ 海軍がアメリカ本土の西海岸に上陸した。\n①ａ・ｃ ②ａ・ｄ ③ｂ・ｃ ④ｂ・ｄ\n問2 太平洋戦争が、第二次世界大戦の一部として戦われることになった理由として最も適当なものを一\n（ ）\nつ選べ。\n①ソ連がすぐに日本に宣戦したから。\n②ドイツ・イタリアもアメリカに宣戦し、枢軸国と連合国の戦いになったから。\n③アメリカがドイツと同盟を結んだから。\n④日本がドイツに宣戦したから。\n問3 【ふりかえり】\n日本が、中国とだけでなくアメリカとも戦争を始めたのはなぜか。 「日中戦争」 「石油」 「ハル=ノー\nト」の三語を用いて80字以内で説明せよ。\n（80字以内）"

        "t": "第二次世界大戦の始まりと日米開戦 確認問題 解答・解説\n１．\n問1 【④】\nⅡ\n独ソ不可侵条約（1939年8月）→Ⅲフランスの降伏（1940\n年6月）→Ⅰ\n独ソ戦（1941年6月） 。\n【この問いのねらい】大戦の流れを「1939＝開戦／1940＝ドイツが周りを占領／1941＝独ソ戦・太平洋戦争」の3つの年でつか\nめているか\n【まちがえたら】表①の最初「大戦の流れを年でつかむ」を見直そう\n問2 【⑤】\nⅢ\n（1941年11月） 。\n日ソ中立条約（1941年4月）→Ⅰ石油と鉄の輸出禁止（1941年7月の南部仏印進駐への対抗）→Ⅱハル=ノート\n【この問いのねらい】\n【まちがえたら】表③を見直そう\n日本が開戦に向かうまでの「中立条約→石油が止まる→ハル=ノート」の順番をつかめているか\n問3 【Ｂ】\n武器貸与法は1941年3月。アメリカは太平洋戦争で参戦する前から、武器や物資を貸してイギリスなどを支えていた。\n【この問いのねらい】アメリカが、参戦する前から連合国の側に立っていたことに気づけるか\n【まちがえたら】表②「アメリカ：中立から連合国の仲間へ」を見直そう\n２．\n問1 【③】\nナチ党は反共産主義で、ソ連とは正反対の立場だった（①は誤り） 。だから両国が手を組んだことに世界はおどろい\nた。\n【この問いのねらい】ソ連が、正反対のドイツと手を組んだ理由（英・仏への不信）をつかめているか\n【まちがえたら】表①「1939年：戦争の始まり」 ・裏①を見直そう\n問2 （解答例）\nポーランドに攻めこむとき、ソ連と戦うのを\nさけたかったから。 （29字）\n採点のポイント：①ポーランドへの侵攻 ②ソ連と戦うのを\nさける の2点。条約には、ポーランドなどを\n独ソで分け\n合う秘密の取り決めもあった。\n【この問いのねらい】ドイツの側にも\n得があったこと＝両国の利害が一致して手を組んだことをつかめているか\n【まちがえたら】裏①「当時の背景」を見直そう\n問3 【②】\nＸは正しい。Ｙは誤り。ソ連もポーランドに攻めこみ、ドイツと領土を分割した。ポーランドは西と東からはさみう\nちにされた。\n【この問いのねらい】\n独ソ不可侵条約が、ポーランド侵攻と大戦の始まりにつながったことをつかめているか\n【まちがえたら】表①・つまり①の上の段を見直そう\n問4 【②】\nｂ イギリスはチャーチル首相のもとでロンドン空襲に耐え、ドイツ軍の本土上陸をはばんだ。 ｃ イタリアはドイ\nツの側で参戦した（枢軸国） 。\n【この問いのねらい】ファシズム\n【まちがえたら】表①「1940\nがヨーロッパの多くを支配した一方で、抵抗も\n年」 ・裏②の地図を見直そう\n続いたことをつかめているか\n３．\n問1 【②】\n条約を破って先に攻めこんだのはドイツ（①は誤り） 。風刺画の「ハネムーン」は2年ほどで終わった。\n【この問いのねらい】手を組んだ2国が、なぜ戦うことになったのかを説明できるか\n【まちがえたら】表②「1941年6月」 ・裏①を見直そう\n問2 （解答例）\nソ連はイギリスと同盟を結び、アメリカ\nもソ連を支援して、米・英・ソが結束した。 （38字）\n採点のポイント：①イギリスとソ連の同盟 ②アメリカのソ連支援（米・英・ソが手を組む） の2点。\n【この問いのねらい】\n独ソ戦が、かえって連合国の結束を生んだことをつかめているか\n【まちがえたら】表②・つまり②の上の段を見直そう\n問3 【③】\nソ連は共産主義、アメリカ・イギリスは資本主義で、しくみはちがった（①は誤り） 。それでもファシズムに対抗する\nために手を組んだ。大西洋憲章は、のちの国際連合憲章のもとになった。\n【この問いのねらい】大西洋憲章によって、大戦が「反ファシズム\n」の戦いという性格をも\nったことをつかめているか\n【まちがえたら】表②「1941年8月：大西洋上の会談」を見直そう\n問4 【③】\nれた。\nポーランド人・ロマ・ソ連軍捕虜なども犠牲になった。 「ユダヤ人だから」という理由だけで、人々が捕らえられ殺さ\n【この問いのねらい】ナチ党の人種主義にもとづく支配が、ホロコーストという大量殺りくにつながったことを理解しているか\n【まちがえたら】表②「ナチ党の占領政策」 ・つまり②の下の段を見直そう\n４．\n問1 【①】\n外相の松岡洋右は、ソ連と組んでアメリカに対抗しようとした。③は1945年のこと（次の講で学ぶ） 。日本はこの中立\n条約をたよりに、戦争の最後にソ連へ仲介をたのむことになる。\n【この問いのねらい】\n日ソ中立条約を結んだねらいをつかめているか（8-2の「ソ連に仲介をたのんだ理由」につながる）\n【まちがえたら】表③「日米交渉」を見直そう\n問2 【②】\nＸは正しい。Ｙは誤り。オランダ領東インドからの石油は14.5％にすぎない。だから軍部は、オランダ領東インドな\nど南方の資源を「手に入れる」ことを考えた。\n【この問いのねらい】グラフから、石油を止め\nられることが日本にとってどれほど大きな打撃かを読み取れるか\n【まちがえたら】裏③のグラフを見直そう\n問3 （解答例）\n資源を得るため南部仏印に進駐すると、アメリカが石油の輸出を全面禁止し、石油がなくなる前に戦えという開戦論\nが強まった。 （58字）\n採点のポイント：①資源を求めて南部仏印に進駐 ②アメリカが石油の輸出を止めた ③開戦論が強まった の3点。\n【この問いのねらい】南部仏印進駐→石油禁輸→開戦論という因果のつながりを説明できるか\n【まちがえたら】表③「石油をめ\nぐって」 ・つまり③の上の段を見直そう\n問4 【④】\nハル=ノートは、中国・仏印からの全面撤退、満洲国など重慶国民政府以外の政権を認めないこと、三国同盟の実質\n的な破棄などを求めた。受け入れれば満洲事変から得たものを手放すことになり、軍や世論は受け入れなかった。東\n条内閣は御前会議で開戦を決めた。\n【この問いのねらい】ハル=ノートを、日本がなぜ受け入れられなかったのかを説明できるか\n【まちがえたら】表③「ハル=ノート」 ・裏③の問いを見直そう\n５．\n問1 【①】\nｂ ソ連とは日ソ中立条約を結んでいた。 ｄ アメリカ本土ではなく、ハワイの真珠湾を攻撃した。奇襲によってア\nメリカの国民は団結した。\n【この問いのねらい】太平洋戦争が、アメリカだけでなくイギリス\nも相手にした戦争だったことをつかめているか\n【まちがえたら】表③「1941年12月8日」を見直そう\n問2 【②】\n①ソ連が日本に宣戦したのは1945年8月（次の講で学ぶ） 。ドイツ・イタリアがアメリカに宣戦し、 「枢軸国（\n日・独・\n伊）VS 連合国（米・英・ソ・中など） 」の世界規模の戦争になった。\n【この問いのねらい】\n日米開戦によって、アジアとヨーロッパの戦争が一つにつながったことをつかめているか\n【まちがえたら】表③の最後・つまり③の下の段を見直そう\n問3 （解答例）\n日中戦争が行き詰まり、資源を求めて南部仏印に進駐するとアメリカに石油の輸出を止められ、中国からの全面撤退\nを求め\nるハル=ノートも受け入れられなかったから。 （76字）\n採点のポイント：①日中戦争の行き詰まり ②南部仏印進駐で石油を止められた ③ハル=ノートを受け入れられな\nかった の3点。\n【この問いのねらい】本時の問い「日本はなぜアメリカと戦争を始めた？」に、因果をつないで答えられるか\n【まちがえたら】表③全体・裏③を見直そう"

        "t": "第二次世界大戦\n教133p－\n太平洋戦争と大戦の結末 確認問題\n組 番 氏名＿＿＿＿＿＿＿＿＿＿＿＿\n１．できごとの順番を考えよう\n問1 次のⅠ〜Ⅲを古い順に並べたものを、下の①〜⑥から一つ選べ。 （ ）\nⅠ 東京大空襲で、一夜で10万人以上が亡くなった。\nⅡ ミッドウェー海戦で日本が大敗し、劣勢になった。\nⅢ サイパン島が陥落し、アメリカの爆撃機B29が日本本土を往復できるようになった。\n①Ⅰ→Ⅱ→Ⅲ ②Ⅰ→Ⅲ→Ⅱ ③Ⅱ→Ⅰ→Ⅲ ④Ⅱ→Ⅲ→Ⅰ ⑤Ⅲ→Ⅰ→Ⅱ ⑥Ⅲ→Ⅱ→Ⅰ\n問2 次のⅠ〜Ⅲを古い順に並べたものを、問1の①〜⑥から一つ選べ。 （ ）\nⅠ 米・英・ソがヤルタ会談を開\nき、ソ連の対日参戦を秘密に決めた。\nⅡ 連合\n軍が北フランスのノルマンディーに上陸した。\nⅢ スターリングラードの戦いで、ソ連がドイツに勝利した。\n問3 次の文の出来事が入る位置を、年表中のＡ〜Ｃから一つ選べ。 （ ）\n「ベルリンが陥落し、ドイツが無条件降伏した。 」\n1944.7 サイパン島陥落 →【Ａ】→ 1945.4 沖縄戦が始まる →【Ｂ】→ 1945.7\nポツダム宣言 →【Ｃ】→ 1945.8 原爆投下\n２．太平洋戦争とアジアの人々\n問1 太平洋戦争が始まったころ、日本の国民の多くがこの戦争に賛成した理由として最も適当なものを\n（ ）\n一つ選べ。\n①日本が中国から兵を引き上げ、日中戦争が終わったから。\n②政府が「大東亜共栄圏」の建設をとなえ、アジアを欧米の支配から解放する戦争だと宣伝したから。\n③戦争が始まると物資が豊かになり、くらしがよくなったから。\n④国際連盟が、日本の戦争を正しいと認めたから。\n問2 「大東亜共栄圏」の建前（表向きの目的）と、日本の本当のねらいのちがいを、 「解放」 「資源」の二語を用いて50\n字以内で説明せよ。\n（50字以内）\n（ ）\n問3 日本が占領した東南アジアについて述べた次のａ〜ｄのうち、正しい\nものの組み合わせを一つ選\nべ。\nａ はじめは、欧米の支配を破った日本を\n歓迎する動き\nもあった。\nｂ 日本は住民の意見を尊重し、ゆるやかな軍政をしいた。\nｃ 住民の虐殺や労働力の徴用に反発し、ベトナム\n独立同盟などの抗日運動が強まった。\nｄ 抗日運動は日本の降伏とともに消え、独立をめざす動きにはつながらなかった。\n①ａ・ｃ ②ａ・ｄ ③ｂ・ｃ ④ｂ・ｄ\n問4 戦争中の台湾・朝鮮について述べた次の文Ｘ・Ｙの正誤の組み合わせとして正しい\nものを一つ選\nべ。\n（ ）\nＸ 日本語を「国語」として教え、神社への参拝を強制する皇民\n政策が強められた。\n化\nＹ 朝鮮では創氏改名が行われたが、戦局が悪\n化\nしても、台湾・朝鮮の人々が徴兵されることはなかった。\n①Ｘ正・Ｙ正 ②Ｘ正・Ｙ誤 ③Ｘ誤・Ｙ正 ④Ｘ誤・Ｙ誤\n３．戦局の悪\n化\nと国民のくらし\n問1 1944年7月のサイパン島の陥落が、日本にとって大きな打撃となった理由として最も適当なものを一\n（ ）\nつ選べ。\n①サイパン島が、日本の石油のおもな産地だったから。\n②ドイツ・イタリアとの連絡がとだえ、三国同盟がなくなったから。\n③アメリカの爆撃機B29が日本本土を往復できるようになり、本土空襲が本格\nしたから。\n化\n④ソ連が、サイパン島を足がかりに日本に宣戦したから。\n問2 戦争中の国民のくらしについて述べた文として誤っている\nものを一つ選べ。 （ ）\n①食料や日用品は配給制になり、武器をつくるため\n金属も供出させられた。\n②中学生以上の学生が勉強を中断し、軍需工場で働いた（学徒勤労動員） 。\n③都市の小学生は、空襲を\nさけて地方へ移された（学童疎開） 。\n④大学生は勉強を続けるため、最後まで戦場には送られなかった。\n問3 沖縄戦について述べた次の文Ｘ・Ｙの正誤の組み合わせとして正しい\nものを一つ選べ。 （ ）\nＸ アメリカ軍が沖縄本島に上陸し、住民を巻きこんだ戦闘となって、日本側の死者は約20万人にのぼった。\nＹ 戦ったのは軍人だけで、学生や住民が戦場に動員されることはなかった。\n①Ｘ正・Ｙ正 ②Ｘ正・Ｙ誤 ③Ｘ誤・Ｙ正 ④Ｘ誤・Ｙ誤\n４．ヨーロッパでの戦争の終わりと連合国の会談\n問1 1943年5月、ソ連がコ\nン\nミ\nテルンを解散したねらいとして最も適当なものを一つ選べ。 （ ）\n①ドイツと、もう一度手を組むため。\n②日本との中立条約を破棄するため。\n③共産主義\nを世界に広め\nる活動を強め\nるため。\n④資本主義の国であるアメリカ・イギリスと、しっかり手を組むため。\n問2 ドイツが降伏に追いこまれた流れとして最も適当なものを一つ選べ。 （ ）\n①イタリアがドイツに宣戦し、南からベルリンを攻め落とした。\n②日本が先に降伏し、ドイツは味方を失って降伏した。\n③スターリングラードの戦いでソ連が反撃し、ノルマンディー上陸で西からも攻められ、東西からはさみうちにされ\nた。\n④アメリカが原子爆弾を投下し、ドイツはすぐに降伏した。\n問3 1945年2月のヤルタ会談について述べた文として最も適当なものを一つ選べ。 （ ）\n①米・英・中が、日本に無条件降伏を勧告した。\n②米・英・ソが、ドイツの戦後処理や国際連合の設立を話し合い、ソ連の対日参戦を秘密に決めた。\n③米・英・中が、日本が無条件降伏するまで戦うことを確認した。\n④米・英が大西洋上で会談し、戦後の世界の目標を発表した。\n問4 第二次世界大戦で行われた都市への爆撃について述べた文として誤っている\nものを一つ選べ。 （ ）\n①先がけとなったのは、ドイツのゲルニカ爆撃と日本の重慶爆撃だった。\n②ドイツはロンドンなどを、連合\n軍はハンブルクやドレスデンなどを爆撃した。\n③爆撃は軍の基地だけをねらって行われ、一般の市民は巻きこまれなかった。\n④日本の都市にも、アメリカ軍の焼夷弾が降りそそいだ。\n５．日本の降伏と戦争の傷あと\n問1 1945年6月、日本がソ連の仲介で和平交渉をしようとしたのに、それが実現しなかったのはなぜか。 「日ソ中立条\n約」 「ヤルタ会談」の二語を用いて60字以内で説明せよ。\n（60字以内）\n（ ）\n問2 ポ\nツダ\nム宣言が出されてから、日本が受諾を決め\nるまでについて述べた次のａ〜ｄのうち、正しい\nものの組み合わせを一つ選べ。\nａ 日本の指導者はソ連の仲介に期待して、宣言を「黙殺」した。\nｂ 日本は、宣言が出されるとすぐに受け入れた。\nｃ 宣言に答えないあいだに、広島・長崎に原子爆弾が投下され、ソ連も\n日本に宣戦した。\nｄ ソ連は、宣言が出される前から日本と戦っていた。\n①ａ・ｃ ②ａ・ｄ ③ｂ・ｃ ④ｂ・ｄ\n問3 戦争の傷あとについて述べた次の文Ｘ・Ｙの正誤の組み合わせとして正しい\nものを一つ選べ。 （ ）\nＸ 日本人の死者は約310万人だが、被害の大半は、戦場となった中国などアジアの人々だった。\nＹ 敗戦後、ソ連に捕らえられた人々はシベリアに送られ、6万人以上が亡くなった。\n①Ｘ正・Ｙ正 ②Ｘ正・Ｙ誤 ③Ｘ誤・Ｙ正 ④Ｘ誤・Ｙ誤\n問4 【ふりかえり】第二次世界大戦で、民間人の犠牲がこれほど大きくなったのはなぜか。 「総力戦」 「空襲」 「原子爆\n弾」の三語を用いて80字以内で説明せよ。\n（80字以内）"

        "t": "太平洋戦争と大戦の結末 確認問題 解答・解説\n１．\n問1 【④】\nⅡ\nミッドウェー海戦（1942年6月）→Ⅲサイパン島陥落（1944年7月）→Ⅰ東京大空襲（1945年3月） 。サイパン島を失\nったことで、本土空襲が本格\nした。\n化\n【この問いのねらい】サイパン島の陥落が「原因」 、本土空襲が「結果」という順番をつかめているか\n【まちがえたら】表①「戦局の悪\n」を見直そう\n化\n問2 【⑥】\nⅢスターリングラードの戦い（1943年2月）→Ⅱノルマンディー上陸（1944年6月）→Ⅰヤルタ会談（1945年2月） 。\n【この問いのねらい】ソ連の反撃→西からの上陸→勝った後を話し合う、というヨーロッパの終わり方の流れをつかめているか\n【まちがえたら】表②を見直そう\n問3 【Ｂ】\nドイツの降伏は1945年5月。沖縄戦（4月〜6月）のさなか。ヨーロッパの戦争が終わった後も、日本は3か月以上戦い\n続けた。\n【この問いのねらい】ドイツが降伏した後も、日本だけが戦い続けたことに気づけるか\n【まちがえたら】表②の最後・表③の最初を見直そう\n２．\n問1 【②】\n大東亜共栄圏＝アジアの諸民族が欧米の植民地支配から脱し、共に栄えるという考え。政府はこの戦争を「大東亜戦\n争」とよんだ。\n【この問いのねらい】国民が戦争に賛成した理由が、政府の「解放」という宣伝にあったことをつかめているか\n【まちがえたら】表①の最初・裏①のビラを見直そう\n問2 （解答例）\n建前はアジアを欧米の支配から解放することだが、本当は占領地の資源と人を支配し戦争を続けることだった。 （50\n字）\n採点のポイント：①建前＝欧米の支配からの解放 ②本音＝資源（と人）の支配・戦争を続けるため の2点。\n【この問いのねらい】大東亜共栄圏の建前と本当のねらいのちがいを説明できるか\n【まちがえたら】表①「でも、本当のねらいは…」 ・裏①を見直そう\n問3 【①】\nｂ 住民の虐殺や労働力の徴用など、厳しい軍政をしいた。泰緬鉄道の建設では、捕虜や現地の人々に多くの犠牲が\n出た。 ｄ 抗日運動は、のちに「民族自決」をめざす独立運動へ発展した。\n【この問いのねらい】 「歓迎」から「反発」へ、そして独立運動へという、アジアの人々の変\n化\nをつかめているか\n【まちがえたら】表①・つまり①の上の段を見直そう\n問4 【②】\nＸは正しい。Ｙは誤り。戦局が悪\n化\nすると、台湾・朝鮮の人々にも徴兵が行われた。朝鮮人・中国人は日本の炭鉱・\n鉱山などにも徴用された。\n【この問いのねらい】植民地の人々も「日本人」として戦争にかり出されたことを理解しているか\n【まちがえたら】表①「台湾・朝鮮では」を見直そう\n３．\n問1 【③】\nた。\nサイパン島からなら、B29が日本本土に爆弾を落として戻ってこられる。戦局悪\n化\nの責任をとって東条内閣は退陣し\n【この問いのねらい】サイパン島の陥落が、なぜ大きな転換点だったのかを説明できるか\n【まちがえたら】表①「戦局の悪\n」 ・つまり①の下の段を見直そう\n化\n問2 【④】\nそれまで徴兵されなかった大学生（文系の男子）も戦場に送られた（学徒出陣） 。\n【この問いのねらい】総力戦が、子どもや学生をふくむ国民すべてをかり出す戦争だったことを理解しているか\n【まちがえたら】表①「国民のくらし」を見直そう\n問3 【②】\nＸは正しい。Ｙは誤り。女子生徒も看護要員として戦場へ動員された（ひめゆり学徒隊） 。住民は壕\nどして多くが犠牲になった。\n【この問いのねらい】沖縄戦が、住民のくらしの場\nがそのまま戦場になった戦いだったことを理解しているか\n【まちがえたら】表①「戦局の悪\n」を見直そう\n化\nを追い出されるな\n４．\n問1 【④】\nコ\nン\nミ\nテルンは共産主義\nを世界に広め\nる組織。ソ連は、資本主義の米・英との協力を優先した。\n【この問いのねらい】しくみのちがう米・英・ソが、ドイツに勝つために結束を強めたことをつかめているか\n【まちがえたら】表②の最初を見直そう\n問2 【③】\n本。\nソ連は武器貸与法などでアメリカと協力し、スターリングラードで勝利した。連合\n軍は1944年にノルマンディーに上\n陸してパリを解放し、ソ連軍は東から進んだ。1945年5月、ドイツは無条件降伏した。④原子爆弾が投下されたのは日\n【この問いのねらい】ドイツが東西からはさみうちにされて降伏した流れをつかめているか\n【まちがえたら】表②・つまり②の上の段を見直そう\n問3 【②】\n①はポ\nツダ\nム宣言（1945年7月） 、③はカイロ会談（1943年11月） 、④は大西洋憲章（1941年8月） 。秘密協定では、ソ連\nに南樺太・千島列島などをわたすことも決めた。\n【この問いのねらい】ヤルタ会談の秘密協定が、その後の日本の運命を左右したことをつかめているか（５の問1につながる）\n【まちがえたら】表②「連合国は「戦後」を話し合う」を見直そう\n問4 【③】\n総力戦では、兵器をつくる工場で働く市民も「戦力」とみなされ、都市そのものがねらわれた。市民に恐怖を植えつ\nけるねらい\nもあった。\n【この問いのねらい】どの国も\n市民をねらって爆撃し、それが広がっていったことを理解しているか\n【まちがえたら】表②「一般市民への爆撃」 ・裏②を見直そう\n５．\n問1 （解答例）\n日ソ中立条約を結んでいたソ連にたよったが、ソ連はヤルタ会談の秘密協定で、すでに対日参戦を決めていたから。\n（52字）\n採点のポイント：①中立条約を結んでいたのでソ連にたよった ②ヤルタ会談で対日参戦が決まっていた（秘密なの\nで日本は知らなかった） の2点。\n【この問いのねらい】\n日ソ中立条約→ソ連に仲介をたのむ→ヤルタの秘密協定で実現しない、というつながりを説明できるか\n【まちがえたら】表③の最初・つまり②の下の段を見直そう\n問2 【①】\nｂ 日本は宣言を「黙殺」した。 ｄ ソ連が日本に宣戦したのは8月8日深夜で、宣言（7月26日）の後。8月14日に受\n諾を決め、15日に玉音放送で国民に知らせ、9月2日に降伏文書に調印した。\n【この問いのねらい】宣言を黙殺しているあいだに、原爆投下とソ連参戦が重なったことをつかめているか\n【まちがえたら】表③の年表・つまり③の上の段を見直そう\n問3 【①】\nＸもＹも正しい。台湾・朝鮮でも「日本人」とされた多くの人が犠牲になった。戦争が終わっても、シベリア抑留や\n中国残留日本人孤児など、苦しみは続いた。\n【この問いのねらい】戦争の傷あとを、日本の被害とアジアの人々の被害の両方から見られているか\n【まちがえたら】表③「戦争の傷あと」 「敗戦直後の日本」 ・裏③を見直そう\n問4 （解答例）\n総力戦で民間人まで戦争にかり出され、都市への空襲や原子爆弾など市民をまきこむ攻撃が行われ、ナチ党の虐殺も\nあったから。 （58字）\n採点のポイント：①総力戦で民間人もかり出された ②空襲・原子爆弾など市民をまきこむ攻撃 の2点（虐殺にふれ\nていればなおよい） 。\n【この問いのねらい】総力戦という戦争の性格が、民間人の犠牲を大きくしたことを説明できるか\n【まちがえたら】表③「戦争の傷あと」 ・つまり③の下の段を見直そう"

         "t": "❶多様な民族と移民：日本とブラジルをつなぐ人々❷大土地所有制と農業：からあげの鶏肉はどこから？\n❸資源と工業化：スマホの電池とアンデスの塩湖❹経済発展と生活の変化：高層ビルのすぐ近くにスラム\n１．ヨーロッパ社会の影響が強い文化\nCheck１：多様な民族が混ざり合う社会\n1492年以前…①　先住民　による高度な文明\n（アステカ王国・インカ帝国など）\n16世紀〜②　スペイン　・③　ポルトガル　が植民地化\n→トルデシリャス条約でブラジルはポルトガル領に\n先住民が激減…過酷な労働と④　感染症　（天然痘など）\n→アフリカから⑤　奴隷　を強制的に移住させる\n→先住民・ヨーロッパ系・アフリカ系の⑥　混血　が進む\n主な国の人種・民族構成（％）\n資料１　「混血」が最も多い国になったブラジル\n2022年のブラジルの国勢調査では、自分を「混血（パルド）」と答えた人が約45％となり、「白人」を初めて上回った。一方、メキシコでは先住民と混血の人が多く、アルゼンチンではヨーロッパ系の人が大部分をしめる。\n（ブラジル地理統計院、帝国書院『新地理総合』p.98などをもとに作成）\nQ．メキシコとアルゼンチンで、人種・民族構成が大きく異なるのはなぜだろうか？\nメキシコ…もともと㋐　先住民　が多く住み、スペイン人との㋑　混血　が進んだから。\nアルゼンチン…先住民が少なく、19世紀以降に㋒　ヨーロッパ　から多くの移民が来たから。\nCheck２：日本とブラジルをつなぐ移民\n公用語…⑦　スペイン語　（ブラジルは⑧　ポルトガル語　）\n宗教…キリスト教の⑨　カトリック　が中心\n→リオのカーニバル＝カトリックの行事＋サンバ\n19世紀に独立→政治・経済は一部の富裕層が支配\n奴隷制廃止（ブラジル1888年）→農園の働き手が不足\n→ヨーロッパや⑩　日本　から移民（1908年笠戸丸）\n1990年〜日系人が日本へ働きに来る（デカセギ）\nラテンアメリカをめぐる人の移動\n資料２　群馬県大泉町は「ブラジルタウン」\nブラジルには約270万人の日系人が暮らし、海外で最大の日系社会となっている。1990年の法改正で日系3世まで日本で働けるようになると、自動車や電機の工場で働く日系ブラジル人が増えた。工場の多い群馬県大泉町では住民の約2割が外国人で、町の案内やスーパーの表示にはポルトガル語も並ぶ。\n（外務省、大泉町の資料などをもとに作成）\n▶ 動画①　外国籍住民が2割超に“共生”進む群馬・大泉町　（ANN、2024年、2分59秒）\nQ．日本に、ブラジル出身の人々が多く暮らす地域があるのはなぜだろうか？\nかつてブラジルへ渡った日本人移民の子孫（㋓　日系人　）が、㋔　1990　年の法改正で日本で働けるようになり、自動車や電機の㋕　工場　が多い地域に移り住んだから。\n２．大土地所有制による農業と社会構造\nCheck１：プランテーションと大牧場\nブラジル…コーヒー・さとうきびの⑪　プランテーション\nアルゼンチンの⑫　パンパ　…肉牛の放牧や小麦\n背景…スペイン・ポルトガルが持ち込んだ⑬　大土地所有制\n農園主（都市に住む）→管理人→住み込み労働者\n→階層社会となり、⑭　貧富の差　が大きい社会に\nエクアドル・中米…欧米資本による⑮　バナナ　栽培\n財務省「貿易統計」などをもとに作成\n資料３　からあげの鶏肉はどこから？\n日本が輸入する鶏肉の約7割はブラジル産で、コンビニのからあげやお弁当にも使われている。ブラジルではトウモロコシや大豆を飼料にして、企業が大規模に鶏を育てている。コーヒー豆やオレンジジュースなども、ブラジルから多く輸入されている。\n（財務省「貿易統計」などをもとに作成）\nCheck２：大豆の国ブラジルとアマゾン\n20世紀後半〜⑯　アグリビジネス　の企業が進出\nブラジル高原の⑰　セラード　で大豆を大規模生産\n→世界の大豆輸出の約5割、主な輸出先は⑱　中国\n住み込み労働者は追い出され、農地改革も不十分\n開発が熱帯林へ→アマゾンの⑲　森林破壊\n近年…アマゾンのアサイーも世界的な人気に\n大豆の収穫（ブラジル）\n資料４　アサイーボウルのふるさとはアマゾン\nアサイーはアマゾンに生えるヤシの実で、栄養価が高い「スーパーフード」として15年ほど前から世界的なブームとなった。日本でもアサイーボウルが人気である。世界のアサイーのおよそ9割はブラジルのアマゾンで生産されているといわれ、ブームで値段が上がって地域の収入が増えた一方、栽培の広がりによる生物多様性への影響や、収穫を担う子どもたちの働き方が問題視されている。\n（TBS NEWS DIG、AFPBB Newsの報道などをもとに作成）\n▶ 動画②　日本でも人気の「アサイー」　収穫の現場で“児童労働”の指摘　（TBS、2025年、3分59秒）\nQ．アサイーや大豆の輸出が増えることの良い点と課題は？　食べる側の私たちにできることは？\n良い点…地域の㋖　収入　が増え、生活水準が上がる。\n課題…子どもが危険な収穫を担う㋗　児童労働　や、㋘　森林破壊　・生物多様性の損失。\n私たちにできること…生産者に適正な価格を払う㋙　フェアトレード　の商品を選ぶ。\n３．外国資本による工業化\nCheck１：鉱産資源とモノカルチャー経済\nボリビアのポトシ銀山…16世紀にスペインが開発\n原油（ベネズエラ・メキシコ）、⑳　鉄鉱石　（ブラジル）、\n㉑　銅　（チリ、世界一）など鉱産資源が豊富\n一部の産物の輸出に依存＝㉒　モノカルチャー経済\n→国際価格が下がると経済が不安定に\n最近…スマホやEVの電池に使う㉓　リチウム　に注目\n「リチウム・トライアングル」\n資料５　スマホの電池とアンデスの塩湖\nスマートフォンやEVの電池に欠かせないリチウムは、チリ・アルゼンチン・ボリビアの国境付近の塩湖に多く埋蔵されており、この地域は「リチウム・トライアングル」とよばれる。世界でEVが増えるにつれて開発が進む一方、大量の地下水を使うため、先住民の暮らしや環境への影響を心配する声もある。\n（各種報道などをもとに作成）\nQ．世界でEVが普及することは、ラテンアメリカの国々にどのような影響を与えるだろうか？\nチャンス…リチウムなどの資源の㋚　輸出　が増え、収入が増える。\n心配…再び特定の資源の輸出に頼る㋛　モノカルチャー経済　になる。㋜　地下水　を大量に使い、環境や先住民の暮らしに影響が出る。\nCheck２：コーヒーの国から飛行機の国へ\n20世紀半ば〜㉔　輸入代替型　の工業化\nブラジル…マナオスに自由貿易地区、外国資本を導入\n→自動車や㉕　航空機　を輸出\n＝㉖　輸出指向型　の工業化\nメキシコ…アメリカ国境沿いに輸出加工区\n→㉗　北米自由貿易協定　（NAFTA、現USMCA）で進出\n2000年代〜中国との貿易が急速に拡大\n航空機メーカーの組立工場（ブラジル）\n資料６　メキシコでつくる日本車\nメキシコ中部には日本の自動車メーカーの工場が集まり、つくられた車の多くは隣のアメリカ合衆国へ輸出される。人件費が比較的安く、アメリカ市場に近いことが進出の理由である。そのため、アメリカ合衆国の貿易政策が変わると、メキシコで働く人々の暮らしにも大きな影響が出る。\n（帝国書院『新地理総合』p.101、各種報道などをもとに作成）\n４．経済発展による生活の変化\nCheck１：高層ビルのすぐ近くにスラム\n無理な経済政策→㉘　累積債務　に苦しむ国も\n国家間の格差拡大→㉙　南米南部共同市場　（MERCOSUR）\nなどで地域統合を進める\nブラジル国内…南東部と北部の大きな地域格差\n→仕事を失った農民などが都市へ移住\n→㉚　スラム　が拡大（ブラジルでは㉛　ファベーラ　）\n→ストリートチルドレンの増加\n都市人口率の推移（World Bank資料、概数）\n資料７　オリンピックの陰で\nブラジルでは約1600万人がファベーラなどに暮らしている（2022年国勢調査）。2016年のリオデジャネイロ・オリンピックでは、会場の周辺で再開発が進み、立ち退きを求められた住民もいた。都市の発展が、すべての人の暮らしを豊かにするとは限らない。\n（ブラジル地理統計院、各種報道などをもとに作成）\nQ．都市のスラムが拡大しているのはなぜだろうか？\n工業化した地域とそうでない地域の㋝　地域格差　が大きく、仕事を失った農民などが㋞　都市　へ移り住んだが、十分な仕事や㋟　住宅　がなかったから。\n▶ 動画③　ブラジルのスラム街「ファベーラ」で“太陽光発電”に脚光　（TBS、2024年、3分16秒）\n５．事例の振り返り\nQ．ラテンアメリカの植民地化や移民の歴史は、社会や産業にどのような影響を与えているのだろうか？　また、日本の私たちとはどのようにつながっているだろうか？\n社会…多様な民族・文化が混ざり合う一方、Ａ　大土地所有制　による貧富の差や、都市のＢ　スラム　が課題に。\n産業…特定の産物の輸出に頼るＣ　モノカルチャー経済　から、Ｄ　外国資本　を導入した工業化へ。\n日本と…Ｅ　日系人　の行き来や、鶏肉・アサイー・銅・リチウムなどのＦ　貿易　でつながっている。"

ラテンアメリカ\nCheck２\nことば・宗教・祭りにみるヨーロッパの影響\n公用語\n多くの国は⑦（　　　）、ブラジルは⑧（　　　）\n宗教\nキリスト教の⑨（　　　）を信じる人が多い。町の中心には教会と広場\n祭り\nリオのカーニバル＝カトリックの行事＋アフリカ系の音楽・踊りサンバ\nリオデジャネイロのカーニバル\n独立したあとも残ったもの\n19世紀に多くの国が独立　→　政治・経済は一部の富裕層が支配\n奴隷制の廃止（ブラジルは1888年）→　コーヒー農園などの働き手が不足　→　移民を受け入れる\nラテンアメリカ\nCheck２\n日本とブラジルをつなぐ移民\n働き手不足を補うため、ヨーロッパや⑩（　　　）から移民\n1908年\n移民船「笠戸丸」で約780人がブラジルのコーヒー農園へ\n戦前〜戦後\nあわせて約25万人の日本人がブラジルへ渡った\n1990年〜\n法改正で日系人が日本の工場で働けるように（デカセギ）\nラテンアメリカ\n資料２\n群馬県大泉町は「ブラジルタウン」\n原文\nブラジルには約270万人の日系人が暮らし、海外で最大の日系社会となっている。1990年の法改正で日系3世まで日本で働けるようになると、自動車や電機の工場で働く日系ブラジル人が増えた。工場の多い群馬県大泉町では住民の約2割が外国人で、町の案内やスーパーの表示にはポルトガル語も並ぶ。\n（外務省、大泉町の資料などをもとに作成）\n大泉町のブラジル系スーパー\n写真：Abasaa / Public domain（Wikimedia Commons）\nラテンアメリカ\n資料２\n群馬県大泉町は「ブラジルタウン」\n約270万人\nブラジルの日系人（海外最大）\n約2割\n大泉町の住民にしめる外国人\n・1990年の法改正で、日系3世まで日本で働けるように\n・自動車や電機の工場で働く日系ブラジル人が増えた\n・2008年のリーマン・ショック後は、仕事を失い帰国した人も\n・町の案内やスーパーの表示にはポルトガル語も\n日本で暮らすブラジル人の数\n（外務省、出入国在留管理庁「在留外国人統計」、大泉町の資料などをもとに作成）\nラテンアメリカ\n動画①\n外国籍住民が2割超に “共生”進む群馬・大泉町\nここに注目！\nなぜ大泉町に外国の人が多いのか\n一緒に暮らすための工夫\n▶ 動画\n外国籍住民が2割超に“共生”進む群馬・大泉町（ANN、2024年、2分59秒）\nラテンアメリカ\nCheck２\n考えてみよう\nQ．日本に、ブラジル出身の人々が多く暮らす地域があるのはなぜだろうか？\n穴埋めで考えよう\nかつてブラジルへ渡った日本人移民の子孫（㋓（　　　））が、㋔（　　　　）年の法改正で日本で働けるようになり、自動車や電機の㋕（　　　）が多い地域に移り住んだから。\n穴埋めで考えよう\nかつてブラジルへ渡った日本人移民の子孫（㋓　日系人　）が、㋔　1990　年の法改正で日本で働けるようになり、自動車や電機の㋕　工場　が多い地域に移り住んだから。\nラテンアメリカ\nCheck１\nプランテーションと大牧場\nブラジル\nコーヒーやさとうきびを⑪（　　　）で生産\n1970年でも、輸出の約3分の1がコーヒー豆だった\nアルゼンチン\n⑫（　　　）（ラプラタ川流域の温帯草原）で肉牛の放牧・小麦\n冷凍船が登場し、ヨーロッパへ牛肉を輸出\nなぜこんなに大規模？\nスペイン・ポルトガルが持ちこんだ⑬（　　　）\n農園主（都市に住む）→ 管理人 → 住み込み労働者\n大農園のよび名：ファゼンダ（ブラジル）、エスタンシア（アルゼンチン）、アシエンダ（メキシコなど）\nラテンアメリカ\nCheck１\n大土地所有制が生んだもの\n農園主：広い土地を所有・都市に住む\n管理人：農園の運営をまかされる\n住み込み労働者：実際に農業をする・まずしい\n農園主を頂点とした階層社会\n→⑭（　　　）が大きい社会に\nエクアドル・中央アメリカ\n→欧米の資本による\n　⑮（　　　）の栽培\nラテンアメリカ\n資料３\nからあげの鶏肉はどこから？\n原文\n日本が輸入する鶏肉の約7割はブラジル産で、コンビニのからあげやお弁当にも使われている。ブラジルではトウモロコシや大豆を飼料にして、企業が大規模に鶏を育てている。コーヒー豆やオレンジジュースなども、ブラジルから多く輸入されている。\n（財務省「貿易統計」などをもとに作成）\nからあげの鶏肉、どこから来た？\n写真：Ocdp / CC0（Wikimedia Commons）\nラテンアメリカ\n資料３\nからあげの鶏肉はどこから？\n日本が輸入する鶏肉\n・コンビニのからあげや、お弁当の鶏肉にも\n・ブラジルでは、トウモロコシや大豆を飼料にして、企業が大規模に鶏を育てる\n・コーヒー豆やオレンジジュースも、ブラジルから多く輸入\n考えよう\n地球の反対側のブラジルから運んでも、安く買えるのはなぜだろう？\n（財務省「貿易統計」などをもとに作成）\nラテンアメリカ\nCheck２\n大豆の国ブラジル\n大豆の収穫（ブラジル）\n20世紀後半〜⑯（　　　）\nの企業が進出\nブラジル高原の⑰（　　　）で\n大豆を大規模に生産\n世界の大豆輸出の約5割\n主な輸出先は⑱（　　　）\n開発が熱帯林へ → アマゾンの⑲（　　　）、住み込み労働者は農園を追われる\nラテンアメリカ\n資料４\nアサイーボウルのふるさとはアマゾン\n原文\nアサイーはアマゾンに生えるヤシの実で、栄養価が高い「スーパーフード」として15年ほど前から世界的なブームとなった。日本でもアサイーボウルが人気である。世界のアサイーのおよそ9割はブラジルのアマゾンで生産されているといわれ、ブームで値段が上がって地域の収入が増えた一方、栽培の広がりによる生物多様性への影響や、収穫を担う子どもたちの働き方が問題視されている。\n（TBS NEWS DIG、AFPBB Newsの報道などをもとに作成）\nカフェで人気のアサイーボウル\n実をとるためヤシに登る（ブラジル）\n写真：T.Tseng / CC BY 2.0、Vieiraproductions / CC BY-SA 4.0（Wikimedia Commons）\nラテンアメリカ\n資料４\nアサイーボウルのふるさとはアマゾン\n約9割\nアマゾン産がしめる割合（世界）\n約6倍\nブームで上がった値段（10年前と比べて）\n光\n地域の収入が増え、\n生活水準が上がった\n影\n子どもが危険な収穫を担う\n（児童労働）・生物多様性への影響\n（TBS NEWS DIG、AFPBB Newsの報道などをもとに作成）\nラテンアメリカ\n動画②\n人気の「アサイー」と“児童労働”\nここに注目！\nアサイーブームの「光」と「影」\n食べる側の私たちとのつながり\n▶ 動画\n日本でも人気の「アサイー」　収穫の現場で“児童労働”の指摘（TBS、2025年、3分59秒）\nラテンアメリカ\nCheck２\n考えてみよう\nQ．アサイーや大豆の輸出が増えることの良い点と課題は？　食べる側の私たちにできることは？\n穴埋めで考えよう\n良い点…地域の㋖（　　　）が増え、生活水準が上がる。\n課題…子どもが危険な収穫を担う㋗（　　　　）や、㋘（　　　　）・生物多様性の損失。\nできること…㋙（　　　　　　　）の商品を選ぶ。\n穴埋めで考えよう\n良い点…地域の㋖　収入　が増え、生活水準が上がる。\n課題…子どもが危険な収穫を担う㋗　児童労働　や、㋘　森林破壊　・生物多様性の損失。\nできること…㋙　フェアトレード　の商品を選ぶ。\nラテンアメリカ\nCheck１\n鉱産資源とモノカルチャー経済\n豊富な鉱産資源\n原油\nベネズエラ・メキシコ\n⑳（　　　）\nブラジル\n㉑（　　　）\nチリ（生産量世界一）\n銀\nボリビア・メキシコ・ペルー\n歴史の中の鉱山\n・ボリビアのポトシ銀山…16世紀にスペインが開発\n・ここの銀がヨーロッパやアジアに運ばれ、世界の経済を結びつけた\nモノカルチャー経済\n一部の農産物や鉱産資源の輸出に依存＝㉒（　　　）\n→　国際価格が下がると、国の経済が不安定に（例：1970年のブラジルはコーヒー豆が輸出の約3分の1）\nラテンアメリカ\n資料５\nスマホの電池とアンデスの塩湖\n原文\nスマートフォンやEVの電池に欠かせないリチウムは、チリ・アルゼンチン・ボリビアの国境付近の塩湖に多く埋蔵されており、この地域は「リチウム・トライアングル」とよばれる。世界でEVが増えるにつれて開発が進む一方、大量の地下水を使うため、先住民の暮らしや環境への影響を心配する声もある。\n（各種報道などをもとに作成）\nSNSで人気「天空の鏡」ウユニ塩湖\n宇宙から見たリチウムの蒸発池（チリ）\n写真：Christopher Crouzet / CC BY-SA 4.0、NASA Earth Observatory / Public domain（Wikimedia Commons）\nラテンアメリカ\n資料５\nスマホの電池とアンデスの塩湖\nスマホやEVの電池に使う㉓（　　　）\n・3か国の国境付近の塩湖に多く埋まる＝「リチウム・トライアングル」\n・塩湖の地下の水をくみ上げ、蒸発させて取り出す　→　大量の地下水を使う\n・先住民の暮らしや環境への影響を心配する声も\n・日本のリチウムの輸入先第1位はチリ\n（各種報道などをもとに作成）\nラテンアメリカ\n資料５\n考えてみよう\nQ．世界でEVが普及することは、ラテンアメリカの国々にどのような影響を与えるだろうか？\n穴埋めで考えよう\nチャンス…リチウムなどの資源の㋚（　　　）が増え、収入が増える。\n心配…再び特定の資源に頼る㋛（　　　　　　　　　）になる。㋜（　　　）を大量に使い、環境や先住民の暮らしに影響が出る。\n穴埋めで考えよう\nチャンス…リチウムなどの資源の㋚　輸出　が増え、収入が増える。\n心配…再び特定の資源に頼る㋛　モノカルチャー経済　になる。㋜　地下水　を大量に使い、環境や先住民の暮らしに影響が出る。\nラテンアメリカ\nCheck２\nコーヒーの国から飛行機の国へ\n20世紀半ば〜\n輸入していた製品を国内で生産\n＝㉔（　　　）の工業化\nブラジル\nマナオスに自由貿易地区\n→自動車や㉕（　　　）\n＝㉖（　　　）の工業化\n航空機メーカーの組立工場（ブラジル）\nラテンアメリカ\nデータ\n輸出品はどう変わった？（1970年→2023年）\nブラジル：コーヒー豆だのみから多様に　／　メキシコ：工業製品が約6割に\n（帝国書院『新地理総合』p.101〈UN Comtrade〉をもとに作成）\nラテンアメリカ\n資料６\nメキシコでつくる日本車\n原文\nメキシコ中部には日本の自動車メーカーの工場が集まり、つくられた車の多くは隣のアメリカ合衆国へ輸出される。人件費が比較的安く、アメリカ市場に近いことが進出の理由である。そのため、アメリカ合衆国の貿易政策が変わると、メキシコで働く人々の暮らしにも大きな影響が出る。\n（帝国書院『新地理総合』p.101、各種報道などをもとに作成）\nラテンアメリカ\n資料６\nメキシコでつくる日本車\n日本\n自動車メーカー\n部品・技術\nメキシコ\n工場\n組み立て\nアメリカ合衆国\n市場\n販売\nアメリカ合衆国との国境沿いに輸出加工区（マキラドーラ）\nなぜメキシコ？\n・人件費が比較的安い\n・アメリカ市場に近い（陸続き）\n・㉗（　　　）（NAFTA、現USMCA）で関税なし\nだから…\nアメリカの貿易政策（関税など）が変わると、メキシコの工場や働く人にも影響が出る\n（帝国書院『新地理総合』p.101、各種報道などをもとに作成）\nラテンアメリカ\nCheck１\n経済発展と格差\n都市人口率の変化（％）\n国と国の間\n外国からの借金で㉘（　　　）に苦しむ国も\n→㉙（　　　）（MERCOSUR）で地域統合\nブラジルの国内\n工業化した南東部と、発展が遅れた北部の地域格差\n→仕事を失った農民などが都市へ\n→㉚（　　　）が拡大（ブラジルでは㉛（　　　））、ストリートチルドレンも\n（World Bank資料をもとに作成）\nラテンアメリカ\n資料７\nオリンピックの陰で\n原文\nブラジルでは約1600万人がファベーラなどに暮らしている（2022年国勢調査）。2016年のリオデジャネイロ・オリンピックでは、会場の周辺で再開発が進み、立ち退きを求められた住民もいた。都市の発展が、すべての人の暮らしを豊かにするとは限らない。\n（ブラジル地理統計院、各種報道などをもとに作成）\n斜面に広がるファベーラ（リオ）\n写真：chensiyuan / CC BY-SA 4.0（Wikimedia Commons）\nラテンアメリカ\n資料７\n高層ビルのすぐ近くにスラム\n約1600万人\nファベーラなどで暮らす人（2022年）\n2016年リオ五輪の会場周辺で\n再開発 → 立ち退きを\n求められた住民も\n（ブラジル地理統計院、World Bank資料、各種報道などをもとに作成）\nラテンアメリカ\n資料７\n考えてみよう\nQ．都市のスラムが拡大しているのはなぜだろうか？\n穴埋めで考えよう\n工業化した地域とそうでない地域の㋝（　　　　）が大きく、仕事を失った農民などが㋞（　　　）へ移り住んだが、十分な仕事や㋟（　　　）がなかったから。\n穴埋めで考えよう\n工業化した地域とそうでない地域の㋝　地域格差　が大きく、仕事を失った農民などが㋞　都市　へ移り住んだが、十分な仕事や㋟　住宅　がなかったから。\nラテンアメリカ\n動画③\nブラジルのスラム街「ファベーラ」で“太陽光発電”に脚光\nここに注目！\nファベーラの暮らしの様子\n住民による新しい取り組み\n▶ 動画\nブラジルのスラム街「ファベーラ」で“太陽光発電”に脚光（TBS、2024年、3分16秒）\nラテンアメリカ\n動画③\n考えてみよう\nQ．ファベーラの暮らしをよくするために、どのような取り組みが必要だろうか？\n自分の考えを書こう\n自分の考えを書こう\n（例）住民が参加する太陽光発電で光熱費を下げる、教育や仕事の機会を増やす、住宅・電気・水道などの生活基盤を整える\nラテンアメリカ\n振り返り\n事例の振り返り\nQ．ラテンアメリカの植民地化や移民の歴史は、社会や産業にどのような影響を与えているのだろうか？\nまた、日本の私たちとはどのようにつながっているだろうか？\n穴埋めでまとめよう\n社会…多様な民族・文化が混ざり合う一方、Ａ（　　　　　　）による貧富の差や、都市のＢ（　　　）が課題に。\n産業…特定の産物の輸出に頼るＣ（　　　　　　　　　）から、Ｄ（　　　　）を導入した工業化へ。\n日本と…Ｅ（　　　）の行き来や、鶏肉・アサイー・銅・リチウムなどのＦ（　　　）でつながっている。\n穴埋めでまとめよう\n社会…多様な民族・文化が混ざり合う一方、Ａ　大土地所有制　による貧富の差や、都市のＢ　スラム　が課題に。\n産業…特定の産物の輸出に頼るＣ　モノカルチャー経済　から、Ｄ　外国資本　を導入した工業化へ。\n日本と…Ｅ　日系人　の行き来や、鶏肉・アサイー・銅・リチウムなどのＦ　貿易　でつながっている。"

地を広げる\n・草は根まで食べられ、木はまきとして切られ、土がむき出しに\n・干ばつが重なると風で土が飛ばされ、元の草原にもどらない\n・＝c（　　　）\n【背景】（プリント裏の穴埋めあり）\n・サヘルはもともと雨が少なく、雨の量が年によって大きく変わる\n・人口が増える \n→ 食べ物や収入のために家畜を増やし、農地を広げる\n・草は根まで食べられ、木はまきとして切られ、土がむき出しに\n・干ばつが重なると風で土が飛ばされ、元の草原にもどらない\n・＝c　砂漠化\nサハラ以南アフリカ\n動画①\nアフリカに巨大な緑の壁　地元経済再生へ\nここに注目！\n砂漠化を止めるために、何をしている？\nその取り組みは、人々のくらしをどう変えた？\n木を植えるだけで解決する？\n▶ 動画①　アフリカに巨大な緑の壁　地元経済再生へ\nBBC News Japan（3分15秒）　https://www.youtube.com/watch?v=w7xmIJ63M_o\nサハラ以南アフリカ\n１\nみんなで考えよう\n砂漠化を止めるために、サヘルの人々に「家畜を減らして」と言えるか？\n見る視点\n家畜は、遊牧の人々にとって食べ物・お金・財産でもある。\n見る視点\n家畜を減らさずに、砂漠化を防ぐ方法はある？（動画①の緑の壁）\n自分 → となり → みんな\n言える：このままでは土地が使えなくなる／言えない：家畜は生活そのもの\n→ 植林・水の管理・放牧の場所を順番に変えるなど、くらしを守りながら土地を回復させる方法を、現地の人と一緒に\nプリント裏の記入欄に書こう（クリックで考えの例）\nサハラ以南アフリカ\n１\nくり返し確認：国境と言語\n19世紀末までにほぼ全域がヨーロッパの植民地 → 1960年代に独立\n（1960年＝「アフリカの年」：17か国が独立）\n\n緯線・経線に沿った⑦（　　　） → 民族の分断・紛争の原因に\n\n民族をこえた共通語：旧宗主国の英語・フランス語\nくわしくは、ほかの講義でくり返し学習\nサハラ以南アフリカ\n２\n売る（輸出）\nアフリカ諸国の経済を支える輸出品（UN Comtrade ほか、主に2019年）\n鉱産資源\n⑧（　　　）（ナイジェリア・アンゴラ）\nダイヤモンド（ボツワナ）・銅（ザンビア）\n⑨（　　　）：スマホ・EVの電池のコバルト\n農産物\nサハラ以南アフリカ\n２\n1つの品目にたよると…\n＝⑪（　　　）\n（ほかの講義でもくり返し学習）\n輸出品の国際価格が下がると、国の収入がすぐに減る\n原料のまま安く売り、加工の利益は外国の企業へ\nカカオ豆の国際価格（IMF資料、教科書p.103）\nサハラ以南アフリカ\n２\n買う（輸入）\n自分たちの主食になる⑫（　　　）が足りない国が多い → 小麦や米を輸入\nなぜ足りない？\n土地がやせ、肥料も少なく収量が低い\n⑬（　　　）をかせぐため、輸出用のカカオやコーヒーを重視\n→自国用の穀物づくりが後回しに\nほかに買うもの\n機械・自動車などの工業製品\n原料を売ったお金で\n食べ物や製品を買う しくみ\nサハラ以南アフリカ\n２\n世界の動きの影響を受けやすい\n2022年 ロシアのウクライナ侵攻\nウクライナ産の小麦が届きにくい\n小麦の価格が上がる\nアフリカに大きな打撃\nなぜアフリカに？\n安いウクライナ産の小麦の輸出の多くは、アフリカやアジアの発展途上国向けだった（教科書p.182）\nつまり\n食料を輸入にたよる国は、遠くの戦争や天候で、くらしがゆさぶられる\nサハラ以南アフリカ\n２\nだれと取引する？\n中国の援助で開通した鉄道（ケニア、2017年）\n新しい結びつき\n旧宗主国（ヨーロッパ）に加え、⑭（　　　）との貿易が急増\n中国の投資で道路・鉄道・港を整備 → 借金（対外債務）の心配も\n日本とのつながり\nガーナのカカオ（チョコレート）\n南アフリカの白金（プラチナ）など\n写真：Erasmus Kamugisha / CC BY-SA 4.0（Wikimedia Commons）\nサハラ以南アフリカ\n資料２\nその国の輸出品の1位は？\nアフリカ諸国の経済を支える輸出品（UN Comtrade ほか、主に2019年）\n【何が書いてある？】プリント裏の穴埋め\n円グラフは輸出額のうち1位・2位の品目の割合。\nナイジェリアやアンゴラはd（　　　）、ボツワナはe（　　　　　　）、ザンビアはf（　　　）、コートジボワールはg（　　　　）が1位。\nどれも、加工する前のh（　　　）である。\n【何が書いてある？】プリント裏の穴埋め\n円グラフは輸出額のうち1位・2位の品目の割合。\nナイジェリアやアンゴラはd原油、\nボツワナはeダイヤモンド　\n、ザンビアはf銅、コートジボワールはgカカオ豆が1位。\nどれも、加工する前のh原料である。\nサハラ以南アフリカ\n資料２\nその国の輸出品の1位は？（背景）\n【背景】\n・原料は安く売られ、加工して高く売る利益は外国の企業に入りやすい\n・一方で、主食の穀物や、機械・自動車などの製品を輸入している\n・原料を売ったお金で食べ物や製品を買うしくみ\n→ 原油や小麦の値段が世界で上下すると、くらしが大きくゆさぶられる\nサハラ以南アフリカ\n２\nみんなで考えよう\nカカオを作る農地と、自分たちの主食を作る農地。どちらを優先すべき？\n見る視点\nカカオを売ったお金で穀物を買う方が、得になることもある？\n見る視点\n小麦の値段が急に上がったら（2022年）、どちらが困る？\n自分 → となり → みんな\nカカオ：外貨がかせげる／主食：世界の値段に左右されない\n→ どちらか一方でなく両方を育てて危険を分散。ネリカ米などの支援や、カカオを加工する工場づくりで選べる道を増やす\nプリント裏の記入欄に書こう（クリックで考えの例）\nサハラ以南アフリカ\n３\n人口：急激に増え続ける\n合計特殊出生率（2018年）\n（World Bank資料、帝国書院『高等学校 新地理総合』）\n20世紀後半から急激な人口増加＝⑮（　　　）\n⑯（　　　）が高い\n1人の女性が一生に産む子どもの平均の数\nニジェールは約7人、日本は約1.4人\n→若い人ほど多い富士山型の人口ピラミッド\nサハラ以南アフリカ\n資料３\n子どもが多いのは「問題」？\n世界の合計特殊出生率（2018年）World Bank資料。帝国書院『高等学校 新地理総合』、今の教科書p.160-161\n【何が書いてある？】プリント裏の穴埋め\n赤い国（i（　　　）以上）はアフリカに集中している。\n最も高いのはj（　　　　　）の6.9、ナイジェリアは5.4。\n日本はk（　　　）、最も低いのは韓国の1.0。2を下回ると人口は将来減っていく。\n【何が書いてある？】\n赤い国（i　5　以上）はアフリカに集中している。最も高いのはjニジェールの6.9、ナイジェリアは5.4。日本はk　1.4、最も低いのは韓国の1.0。2を下回ると人口は将来減っていく。\nサハラ以南アフリカ\n資料３\n子どもが多いのは「問題」？（背景）\n【背景】\n・農村では、子どもは農作業や水くみの大切な働き手\n・親の老後の支えにもなる\n・幼いうちに亡くなる子どもが多く、多く産むことが必要とされてきた\n・教育を受ける女性が増え、医療が整うと出生率は下がる傾向\n・人口の多さは、働き手や市場が大きくなる強みにもなる\nサハラ以南アフリカ\n３\n人が増えると…\n高層ビルが並ぶラゴス\n水の上に広がるスラム（ラゴス）\n都市\n農村から都市へ → インフラが追いつかず⑰（　　　）に\n食料\n子どもの約3人に1人が慢性的な⑱（　　　）\n水\n安全な⑲（　　　）を使えない人がサハラ以南に集中\n学校\n遠くへの水くみは子どもの仕事 → 学校に通えないことも\n写真：Jamie Tubers / CC BY-SA 4.0、Ayorinde Ogundele / CC BY-SA 4.0（Wikimedia Commons）\nサハラ以南アフリカ\n動画②\n13歳のアイシャの1日～水を得るために～\nここに注目！\nアイシャは1日に何時間、水くみをしている？\nその水は安全？\n水くみがなければ、アイシャは何ができる？\n▶ 動画②　13歳のアイシャの1日～水を得るために～\n日本ユニセフ協会（3分29秒）　https://www.youtube.com/watch?v=PP0IvKmLfRY\nサハラ以南アフリカ\n３\n命と安全\n感染症\n⑳（　　　）（蚊が運ぶ）\nエイズ・エボラ出血熱など\n\n日本企業の防虫効果のある蚊帳が、マラリアの予防に役立っている\n紛争\n民族や資源をめぐる争い（スーダン・南スーダンなど）\n→国の外へのがれる㉑（　　　）が多く発生\n\n植民地時代の人為的国境も、対立の原因の一つ\nサハラ以南アフリカ\n３\nでも、変化も起きている\nM-PESAの代理店（ケニア）\n医薬品を運ぶドローン（ルワンダ）\n一足飛びの新技術\n固定電話より先に㉒（　　　）が普及（ケニアは100％超）\n→銀行口座がなくても送金・決済ができる\nルワンダ：ドローンで医薬品を輸送、ICT産業で成長\n支援\nODA（政府開発援助）NGO\nJICA海外協力隊がネリカ米（乾燥に強い稲）の栽培を支援\n写真：Realt0n12 / CC BY-SA 3.0、Roksenhorn / CC BY-SA 4.0（Wikimedia Commons）\nサハラ以南アフリカ\n３\nみんなで考えよう\nアフリカで子どもが多いことは「問題」なのか、「希望」なのか？\n見る視点\n若い人が多い国と、高齢者が多い日本をくらべると？\n見る視点\n人が増えたとき、仕事・食料・水・学校は足りる？（動画②）\n自分 → となり → みんな\n問題：食料・水・学校が足りない／希望：働く若者が増えれば経済が成長\n→ 人口の多さ自体より、教育・医療・雇用が追いつくかが大切。日本の少子化とは逆の「人口と社会のバランス」の問題\nプリント裏の記入欄に書こう（クリックで考えの例）\nサハラ以南アフリカ\nまとめ\nつまり…（プリントの「つまり」）\n各列の「つまり」\n①干ばつに加え、人口増加でＡ（　　　）や過耕作が進んだから、サヘルではＢ（　　　）が広がってしまった。\n②輸出用の作物を重視して自国用のＣ（　　　）づくりが遅れたから、小麦などをＤ（　　　）にたよるようになってしまった。\n③出生率が高くＥ（　　　　）が起きているのに、インフラや食料・水の供給がＦ（　　　　　　）。\n各列の「つまり」\n①干ばつに加え、人口増加でＡ過放牧や過耕作が進んだから、サヘルではＢ砂漠化が広がってしまった。\n②輸出用の作物を重視して自国用のＣ穀物づくりが遅れたから、小麦などをＤ輸入にたよるようになってしまった。\n③出生率が高くＥ人口爆発が起きているのに、インフラや食料・水の供給がＦ追いつかない。"
